name: Terraform CD

on:
  push:
    branches:
      - main
  workflow_dispatch:


permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true

jobs:

  # ============================================================
  # Terraform Plan - DEV
  # ============================================================
  terraform-plan:
    name: Terraform Plan - DEV
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./23-08-26/env/dev

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # Create terraform.tfvars
      # --------------------------------------------------------
      - name: Create Terraform Variables File
        shell: bash
        run: |
          cat > terraform.tfvars <<'EOF'
          ${{ secrets.TFVARS_CONTENT }}
          EOF

      # --------------------------------------------------------
      # Check terraform.tfvars
      # --------------------------------------------------------
      - name: Check Terraform Variables File
        shell: bash
        run: |
          test -s terraform.tfvars
          echo "terraform.tfvars created successfully"

      # --------------------------------------------------------
      # Azure Login
      # --------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------
      - name: Terraform Init
        run: terraform init -input=false

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------
      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -var-file="terraform.tfvars" \
            -out="tfplan"

      # --------------------------------------------------------
      # Upload Terraform Plan
      # --------------------------------------------------------
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-dev
          path: 23-08-26/env/dev/tfplan


  # ============================================================
  # Terraform Apply - DEV
  # ============================================================
  terraform-apply:
    name: Terraform Apply - DEV
    runs-on: ubuntu-latest

    needs:
      - terraform-plan

    # DEV approval required before Apply
    environment:
      name: dev

    defaults:
      run:
        working-directory: ./23-08-26/env/dev

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # Create terraform.tfvars
      # --------------------------------------------------------
      - name: Create Terraform Variables File
        shell: bash
        run: |
          cat > terraform.tfvars <<'EOF'
          ${{ secrets.TFVARS_CONTENT }}
          EOF

      # --------------------------------------------------------
      # Check terraform.tfvars
      # --------------------------------------------------------
      - name: Check terraform.tfvars
      - name: Check Terraform Variables File
        shell: bash
        run: |
          test -s terraform.tfvars
          echo "terraform.tfvars created successfully"

      # --------------------------------------------------------
      # Azure Login
      # --------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------
      - name: Terraform Init
        run: terraform init -input=false

      # --------------------------------------------------------
      # Download Terraform Plan
      # --------------------------------------------------------
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-dev
          path: 23-08-26/env/dev

      # --------------------------------------------------------
      # Check downloaded plan
      # --------------------------------------------------------
      - name: Check Terraform Plan
        shell: bash
        run: |
          ls -la
          test -f tfplan
          echo "Terraform plan downloaded successfully"

      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan