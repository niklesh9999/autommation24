
trigger:
- main

pool:
  name: Terraform-Agent-Pool

variables:
  TF_IN_AUTOMATION: 'true'
  TF_WORKING_DIR: '23-08-26/env/dev'

steps:

# ============================================================
# 1. CHECKOUT SOURCE CODE
# ============================================================

- checkout: self
  clean: true
  displayName: 'Checkout source code'


# ============================================================
# 2. DOWNLOAD SECURE TERRAFORM.TFVARS
# ============================================================

- task: DownloadSecureFile@1
  name: tfvarsFile
  displayName: 'Download terraform.tfvars - DEV'
  inputs:
    secureFile: 'terraform.tfvars'


# ============================================================
# 3. COPY TERRAFORM.TFVARS TO DEV WORKING DIRECTORY
# ============================================================

- powershell: |

    Write-Host "=============================================="
    Write-Host "PREPARING TERRAFORM.TFVARS - DEV"
    Write-Host "=============================================="

    $source = "$(tfvarsFile.secureFilePath)"
    $workingDir = "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"
    $destination = "$workingDir\terraform.tfvars"

    Write-Host "Secure file:"
    Write-Host $source

    Write-Host "Terraform working directory:"
    Write-Host $workingDir

    if (-not (Test-Path $source)) {
        Write-Error "Secure terraform.tfvars was not downloaded."
        exit 1
    }

    if (-not (Test-Path $workingDir)) {
        Write-Error "Terraform working directory does not exist."
        exit 1
    }

    Copy-Item `
        -Path $source `
        -Destination $destination `
        -Force

    if (-not (Test-Path $destination)) {
        Write-Error "terraform.tfvars was not copied."
        exit 1
    }

    Write-Host ""
    Write-Host "terraform.tfvars copied successfully."
    Write-Host "DEV terraform configuration is ready."

  displayName: 'Prepare Terraform tfvars - DEV'


# ============================================================
# 4. VERIFY TERRAFORM
# ============================================================

- powershell: |

    Write-Host "=============================================="
    Write-Host "VERIFY TERRAFORM"
    Write-Host "=============================================="

    terraform version

    if ($LASTEXITCODE -ne 0) {
        Write-Error "Terraform is not available on the agent."
        exit 1
    }

    Write-Host "Terraform verification completed."

  displayName: 'Verify Terraform'


# ============================================================
# 5. VERIFY AZURE CLI
# ============================================================

- powershell: |

    Write-Host "=============================================="
    Write-Host "VERIFY AZURE CLI"
    Write-Host "=============================================="

    az version

    if ($LASTEXITCODE -ne 0) {
        Write-Error "Azure CLI is not available on the agent."
        exit 1
    }

    Write-Host "Azure CLI verification completed."

  displayName: 'Verify Azure CLI'


# ============================================================
# 6. TERRAFORM FORMAT CHECK
# ============================================================

- powershell: |

    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "=============================================="
    Write-Host "TERRAFORM FORMAT CHECK - DEV"
    Write-Host "=============================================="

    terraform fmt -check -recursive

    if ($LASTEXITCODE -ne 0) {
        Write-Error "Terraform format check failed."
        exit 1
    }

    Write-Host "Terraform format check passed."

  displayName: 'Terraform - Format Check'


# ============================================================
# 7. TERRAFORM INIT
# ============================================================

- powershell: |

    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "=============================================="
    Write-Host "TERRAFORM INIT - DEV"
    Write-Host "=============================================="

    terraform init -input=false

    if ($LASTEXITCODE -ne 0) {
        Write-Error "Terraform init failed."
        exit 1
    }

    Write-Host "Terraform init completed successfully."

  displayName: 'Terraform - Init'


# ============================================================
# 8. TERRAFORM VALIDATE
# ============================================================

- powershell: |

    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "=============================================="
    Write-Host "TERRAFORM VALIDATE - DEV"
    Write-Host "=============================================="

    terraform validate

    if ($LASTEXITCODE -ne 0) {
        Write-Error "Terraform validation failed."
        exit 1
    }

    Write-Host "Terraform validation passed."

  displayName: 'Terraform - Validate'


# ============================================================
# 9. AZURE LOGIN
# ============================================================

- powershell: |

    Write-Host "=============================================="
    Write-Host "AZURE LOGIN - DEV"
    Write-Host "=============================================="

    if (-not $env:AZURE_CLIENT_ID) {
        Write-Error "AZURE_CLIENT_ID is not configured."
        exit 1
    }

    if (-not $env:AZURE_CLIENT_SECRET) {
        Write-Error "AZURE_CLIENT_SECRET is not configured."
        exit 1
    }

    if (-not $env:AZURE_TENANT_ID) {
        Write-Error "AZURE_TENANT_ID is not configured."
        exit 1
    }

    if (-not $env:AZURE_SUBSCRIPTION_ID) {
        Write-Error "AZURE_SUBSCRIPTION_ID is not configured."
        exit 1
    }

    az login `
        --service-principal `
        --username "$env:AZURE_CLIENT_ID" `
        --password "$env:AZURE_CLIENT_SECRET" `
        --tenant "$env:AZURE_TENANT_ID" `
        --output none

    if ($LASTEXITCODE -ne 0) {
        Write-Error "Azure login failed."
        exit 1
    }

    az account set `
        --subscription "$env:AZURE_SUBSCRIPTION_ID"

    if ($LASTEXITCODE -ne 0) {
        Write-Error "Azure subscription selection failed."
        exit 1
    }

    Write-Host "Azure login successful."
    Write-Host "Azure subscription selected successfully."

  displayName: 'Azure Login - DEV'

  env:
    AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
    AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
    AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
    AZURE_TENANT_ID: $(AZURE_TENANT_ID)


# ============================================================
# 10. TERRAFORM PLAN
# ============================================================

- powershell: |

    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "=============================================="
    Write-Host "TERRAFORM PLAN - DEV"
    Write-Host "=============================================="

    terraform plan `
        -input=false `
        -out=tfplan

    if ($LASTEXITCODE -ne 0) {
        Write-Error "Terraform plan failed."
        exit 1
    }

    Write-Host ""
    Write-Host "Terraform plan completed successfully."

  displayName: 'Terraform - Plan DEV'

  env:
    ARM_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
    ARM_CLIENT_ID: $(AZURE_CLIENT_ID)
    ARM_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
    ARM_TENANT_ID: $(AZURE_TENANT_ID)


# ============================================================
# 11. PUBLISH TERRAFORM PLAN
# ============================================================

- task: PublishPipelineArtifact@1
  displayName: 'Publish Terraform Plan - DEV'
  inputs:
    targetPath: '$(Build.SourcesDirectory)\$(TF_WORKING_DIR)\tfplan'
    artifact: 'terraform-plan-dev'
    publishLocation: 'pipeline'


# ============================================================
# 12. DEV CD PLAN COMPLETED
# ============================================================

- powershell: |

    Write-Host "=============================================="
    Write-Host "       DEV CD PLAN COMPLETED"
    Write-Host "=============================================="

    Write-Host ""
    Write-Host "Environment : DEV"
    Write-Host "Branch      : $(Build.SourceBranch)"
    Write-Host "Build       : $(Build.BuildNumber)"

    Write-Host ""
    Write-Host "Terraform Plan artifact published."
    Write-Host ""
    Write-Host "IMPORTANT:"
    Write-Host "Terraform APPLY was NOT executed."
    Write-Host "Approval will be required before APPLY."

  displayName: 'DEV Plan Completed'

