
trigger:
- main

pool:
  name: Terraform-Agent-Pool

variables:
  TF_IN_AUTOMATION: 'true'
  TF_WORKING_DIR: '23-08-26/env/dev'

stages:

# ============================================================
# STAGE 1 - TERRAFORM PLAN
# ============================================================

- stage: Terraform_Plan
  displayName: 'Terraform Plan - DEV'

  jobs:

  - job: Plan
    displayName: 'Terraform Plan - DEV'

    steps:

    # ========================================================
    # 1. CHECKOUT
    # ========================================================

    - checkout: self
      clean: true
      displayName: 'Checkout source code'


    # ========================================================
    # 2. VERIFY TERRAFORM
    # ========================================================

    - powershell: |

        Write-Host "=============================================="
        Write-Host "VERIFY TERRAFORM"
        Write-Host "=============================================="

        terraform version

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform is not available."
          exit 1
        }

      displayName: 'Verify Terraform'


    # ========================================================
    # 3. CREATE TERRAFORM.TFVARS
    # ========================================================

    - powershell: |

        $tfDir = "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

        Write-Host "Terraform directory:"
        Write-Host $tfDir

        if (-not (Test-Path $tfDir)) {
          Write-Error "Terraform working directory not found."
          exit 1
        }

        if (-not $env:TFVARS_CONTENT) {
          Write-Error "TFVARS_CONTENT is empty."
          exit 1
        }

        [System.IO.File]::WriteAllText(
          "$tfDir\terraform.tfvars",
          $env:TFVARS_CONTENT,
          [System.Text.UTF8Encoding]::new($false)
        )

        Write-Host "terraform.tfvars created successfully."

      displayName: 'Create Terraform Variables'

      env:
        TFVARS_CONTENT: $(TFVARS_CONTENT)


    # ========================================================
    # 4. AZURE LOGIN
    # ========================================================

    - powershell: |

        Write-Host "=============================================="
        Write-Host "AZURE LOGIN"
        Write-Host "=============================================="

        az login `
          --service-principal `
          --username "$env:AZURE_CLIENT_ID" `
          --password "$env:AZURE_CLIENT_SECRET" `
          --tenant "$env:AZURE_TENANT_ID"

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Azure login failed."
          exit 1
        }

        az account set `
          --subscription "$env:AZURE_SUBSCRIPTION_ID"

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Azure subscription selection failed."
          exit 1
        }

        Write-Host "Azure login successful."

        az account show

      displayName: 'Azure Login'

      env:
        AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
        AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
        AZURE_TENANT_ID: $(AZURE_TENANT_ID)
        AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)


    # ========================================================
    # 5. TERRAFORM FORMAT
    # ========================================================

    - powershell: |

        Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

        Write-Host "=============================================="
        Write-Host "TERRAFORM FORMAT CHECK"
        Write-Host "=============================================="

        terraform fmt -check -recursive

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform format check failed."
          exit 1
        }

        Write-Host "Terraform format check passed."

      displayName: 'Terraform - Format Check'


    # ========================================================
    # 6. TERRAFORM INIT
    # ========================================================

    - powershell: |

        Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

        Write-Host "=============================================="
        Write-Host "TERRAFORM INIT"
        Write-Host "=============================================="

        terraform init -input=false

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform init failed."
          exit 1
        }

        Write-Host "Terraform init completed."

      displayName: 'Terraform - Init'


    # ========================================================
    # 7. TERRAFORM VALIDATE
    # ========================================================

    - powershell: |

        Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

        Write-Host "=============================================="
        Write-Host "TERRAFORM VALIDATE"
        Write-Host "=============================================="

        terraform validate

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform validation failed."
          exit 1
        }

        Write-Host "Terraform validation passed."

      displayName: 'Terraform - Validate'


    # ========================================================
    # 8. TERRAFORM PLAN
    # ========================================================

    - powershell: |

        Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

        Write-Host "=============================================="
        Write-Host "TERRAFORM PLAN - DEV"
        Write-Host "=============================================="

        terraform plan `
          -input=false `
          -out=tfplan

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform plan failed."
          exit 1
        }

        Write-Host "Terraform plan completed successfully."

      displayName: 'Terraform - Plan'


    # ========================================================
    # 9. PUBLISH TFPLAN
    # ========================================================

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(Build.SourcesDirectory)\$(TF_WORKING_DIR)\tfplan'
        artifact: 'terraform-plan'
        publishLocation: 'pipeline'


# ============================================================
# STAGE 2 - APPROVAL + APPLY
# ============================================================

- stage: Terraform_Apply
  displayName: 'Terraform Apply - DEV'

  dependsOn:
  - Terraform_Plan

  condition: succeeded()

  jobs:

  # ==========================================================
  # IMPORTANT:
  # environment: dev
  #
  # Azure DevOps will check the approval configured on
  # Pipelines -> Environments -> dev -> Approvals and checks
  # BEFORE this deployment starts.
  # ==========================================================

  - deployment: TerraformApply
    displayName: 'Terraform Apply - DEV'

    environment: 'dev'

    pool:
      name: Terraform-Agent-Pool

    strategy:

      runOnce:

        deploy:

          steps:

          # ==================================================
          # 1. CHECKOUT
          # ==================================================

          - checkout: self
            clean: true
            displayName: 'Checkout source code'


          # ==================================================
          # 2. DOWNLOAD TFPLAN
          # ==================================================

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Plan'
            inputs:
              buildType: 'current'
              artifactName: 'terraform-plan'
              targetPath: '$(Pipeline.Workspace)\terraform-plan'


          # ==================================================
          # 3. CREATE TERRAFORM.TFVARS
          # ==================================================

          - powershell: |

              $tfDir = "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

              Write-Host "Terraform directory:"
              Write-Host $tfDir

              if (-not (Test-Path $tfDir)) {
                Write-Error "Terraform working directory not found."
                exit 1
              }

              if (-not $env:TFVARS_CONTENT) {
                Write-Error "TFVARS_CONTENT is empty."
                exit 1
              }

              [System.IO.File]::WriteAllText(
                "$tfDir\terraform.tfvars",
                $env:TFVARS_CONTENT,
                [System.Text.UTF8Encoding]::new($false)
              )

              Write-Host "terraform.tfvars created successfully."

            displayName: 'Create Terraform Variables'

            env:
              TFVARS_CONTENT: $(TFVARS_CONTENT)


          # ==================================================
          # 4. AZURE LOGIN
          # ==================================================

          - powershell: |

              Write-Host "=============================================="
              Write-Host "AZURE LOGIN FOR APPLY"
              Write-Host "=============================================="

              az login `
                --service-principal `
                --username "$env:AZURE_CLIENT_ID" `
                --password "$env:AZURE_CLIENT_SECRET" `
                --tenant "$env:AZURE_TENANT_ID"

              if ($LASTEXITCODE -ne 0) {
                Write-Error "Azure login failed."
                exit 1
              }

              az account set `
                --subscription "$env:AZURE_SUBSCRIPTION_ID"

              if ($LASTEXITCODE -ne 0) {
                Write-Error "Azure subscription selection failed."
                exit 1
              }

              Write-Host "Azure login successful."

            displayName: 'Azure Login - Apply'

            env:
              AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
              AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
              AZURE_TENANT_ID: $(AZURE_TENANT_ID)
              AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)


          # ==================================================
          # 5. TERRAFORM INIT
          # ==================================================

          - powershell: |

              Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

              terraform init -input=false

              if ($LASTEXITCODE -ne 0) {
                Write-Error "Terraform init failed."
                exit 1
              }

              Write-Host "Terraform init completed."

            displayName: 'Terraform - Init for Apply'


          # ==================================================
          # 6. COPY TFPLAN
          # ==================================================

          - powershell: |

              $source = "$(Pipeline.Workspace)\terraform-plan\tfplan"
              $destination = "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)\tfplan"

              Write-Host "Plan source:"
              Write-Host $source

              Write-Host "Plan destination:"
              Write-Host $destination

              if (-not (Test-Path $source)) {
                Write-Error "Terraform plan artifact not found."
                exit 1
              }

              Copy-Item `
                -Path $source `
                -Destination $destination `
                -Force

              Write-Host "Terraform plan copied successfully."

            displayName: 'Prepare Terraform Plan'


          # ==================================================
          # 7. TERRAFORM APPLY
          # ==================================================

          - powershell: |

              Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

              Write-Host "=============================================="
              Write-Host "TERRAFORM APPLY - DEV"
              Write-Host "=============================================="

              terraform apply `
                -input=false `
                -auto-approve `
                tfplan

              if ($LASTEXITCODE -ne 0) {
                Write-Error "Terraform apply failed."
                exit 1
              }

              Write-Host "=============================================="
              Write-Host "TERRAFORM APPLY COMPLETED SUCCESSFULLY"
              Write-Host "ENVIRONMENT: DEV"
              Write-Host "=============================================="

            displayName: 'Terraform - Apply DEV'

