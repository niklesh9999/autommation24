
trigger:
- fetaure

pool:
  name: Terraform-Agent-Pool

variables:
  TF_IN_AUTOMATION: 'true'
  TF_WORKING_DIR: '23-08-26/env/dev'

steps:

# ============================================================
# 1. CHECKOUT
# ============================================================

- checkout: self
  clean: true
  displayName: 'Checkout source code'


# ============================================================
# 2. SET TOOL PATHS
# ============================================================

- powershell: |

    Write-Host "============================================================"
    Write-Host "SETTING DEVSECOPS TOOL PATHS"
    Write-Host "============================================================"

    $pythonHome = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonHome\Scripts"

    $env:Path = "$pythonHome;$pythonScripts;$env:Path"

    Write-Host ""
    Write-Host "Python:"
    python --version

    Write-Host ""
    Write-Host "Checkov:"
    checkov.cmd --version

    Write-Host ""
    Write-Host "Terraform:"
    terraform version

    Write-Host ""
    Write-Host "Git:"
    git --version

    Write-Host ""
    Write-Host "Azure CLI:"
    az version

    Write-Host ""
    Write-Host "Node:"
    node --version

    Write-Host ""
    Write-Host "NPM:"
    npm --version

    Write-Host ""
    Write-Host "Snyk:"
    snyk.cmd --version

    Write-Host ""
    Write-Host "============================================================"
    Write-Host "TOOL PATH SETUP COMPLETED"
    Write-Host "============================================================"

  displayName: 'Set DevSecOps Tool Paths'


# ============================================================
# 3. GITLEAKS
# ============================================================

- powershell: |

    Write-Host "============================================================"
    Write-Host "[1/9] GITLEAKS SECRET SCAN"
    Write-Host "============================================================"

    $gitleaks = "C:\Users\Niklesh k\AppData\Local\Microsoft\WinGet\Packages\Gitleaks.Gitleaks_Microsoft.Winget.Source_8wekyb3d8bbwe\gitleaks.exe"

    if (-not (Test-Path $gitleaks)) {
      Write-Warning "Gitleaks not found."
      Write-Warning "TESTING MODE - Continuing pipeline."
      exit 0
    }

    Write-Host "Gitleaks version:"
    & $gitleaks version

    Write-Host ""
    Write-Host "Scanning:"
    Write-Host "$(Build.SourcesDirectory)"

    New-Item `
      -ItemType Directory `
      -Force `
      -Path "$(Build.ArtifactStagingDirectory)" | Out-Null

    & $gitleaks detect `
      --source "$(Build.SourcesDirectory)" `
      --report-format sarif `
      --report-path "$(Build.ArtifactStagingDirectory)\gitleaks.sarif" `
      --no-banner

    $exitCode = $LASTEXITCODE

    Write-Host ""
    Write-Host "Gitleaks Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Warning "Gitleaks found security issues."
      Write-Warning "TESTING MODE - Continuing pipeline."
    }
    else {
      Write-Host "Gitleaks scan passed."
    }

    exit 0

  displayName: 'GitLeaks - Secret Scan'


# ============================================================
# 4. CHECKOV - RESOURCE GROUP
# ============================================================

- powershell: |

    Write-Host "============================================================"
    Write-Host "[2/9] CHECKOV - RESOURCE GROUP"
    Write-Host "============================================================"

    $pythonHome = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonHome\Scripts"

    $env:Path = "$pythonHome;$pythonScripts;$env:Path"

    $path = "$(Build.SourcesDirectory)\23-08-26\module\rg"

    Write-Host "Scanning path:"
    Write-Host $path

    if (-not (Test-Path $path)) {
      Write-Warning "Resource Group path does not exist."
      exit 0
    }

    Write-Host ""
    Write-Host "Checkov version:"
    checkov.cmd --version

    Write-Host ""
    Write-Host "Running Checkov..."

    checkov.cmd `
      -d $path `
      --framework terraform `
      --output cli

    $exitCode = $LASTEXITCODE

    Write-Host ""
    Write-Host "Resource Group Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Warning "Checkov found Resource Group security issues."
      Write-Warning "TESTING MODE - Continuing pipeline."
    }
    else {
      Write-Host "Resource Group Checkov scan passed."
    }

    exit 0

  displayName: 'Checkov - Resource Group'


# ============================================================
# 5. CHECKOV - VNET
# ============================================================

- powershell: |

    Write-Host "============================================================"
    Write-Host "[3/9] CHECKOV - VNET"
    Write-Host "============================================================"

    $pythonHome = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonHome\Scripts"

    $env:Path = "$pythonHome;$pythonScripts;$env:Path"

    $path = "$(Build.SourcesDirectory)\23-08-26\module\vnet"

    Write-Host "Scanning path:"
    Write-Host $path

    if (-not (Test-Path $path)) {
      Write-Warning "VNET path does not exist."
      exit 0
    }

    checkov.cmd `
      -d $path `
      --framework terraform `
