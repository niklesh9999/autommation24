
trigger:
- fetaure

pool:
  name: Terraform-Agent-Pool

variables:
  TF_IN_AUTOMATION: 'true'
  TF_WORKING_DIR: '23-08-26/env/dev'

steps:

# ============================================================
# 1. CHECKOUT SOURCE CODE
# ============================================================

- checkout: self
  clean: true
  displayName: 'Checkout source code'


# ============================================================
# 2. CONFIGURE TOOL PATHS
# ============================================================

- powershell: |
    Write-Host "=============================================="
    Write-Host "CONFIGURING DEVSECOPS TOOL PATHS"
    Write-Host "=============================================="

    $pythonPath = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonPath\Scripts"

    $gitLeaksPath = "C:\Users\Niklesh k\AppData\Local\Microsoft\WinGet\Packages\Gitleaks.Gitleaks_Microsoft.Winget.Source_8wekyb3d8bbwe"

    $nodePath = "C:\Program Files\nodejs"
    $snykPath = "C:\Users\Niklesh k\AppData\Roaming\npm"

    $env:PATH = "$pythonScripts;$pythonPath;$gitLeaksPath;$nodePath;$snykPath;$env:PATH"

    Write-Host "PATH configured."

    Write-Host ""
    Write-Host "Git:"
    git --version

    Write-Host ""
    Write-Host "Terraform:"
    terraform version

    Write-Host ""
    Write-Host "Azure CLI:"
    az version

    Write-Host ""
    Write-Host "Python:"
    python --version

    Write-Host ""
    Write-Host "Checkov:"
    checkov --version

    Write-Host ""
    Write-Host "GitLeaks:"
    gitleaks version

    Write-Host ""
    Write-Host "Node:"
    node --version

    Write-Host ""
    Write-Host "NPM:"
    npm.cmd --version

    Write-Host ""
    Write-Host "Snyk:"
    snyk.cmd --version

  displayName: 'Verify All DevSecOps Tools'


# ============================================================
# 3. GITLEAKS SECRET SCAN
# ============================================================

- powershell: |
    $gitLeaksPath = "C:\Users\Niklesh k\AppData\Local\Microsoft\WinGet\Packages\Gitleaks.Gitleaks_Microsoft.Winget.Source_8wekyb3d8bbwe"

    $env:PATH = "$gitLeaksPath;$env:PATH"

    Write-Host "=============================================="
    Write-Host "Running GitLeaks Secret Scan"
    Write-Host "=============================================="

    New-Item `
      -ItemType Directory `
      -Force `
      -Path "$(Build.ArtifactStagingDirectory)" | Out-Null

    gitleaks detect `
      --source "$(Build.SourcesDirectory)" `
      --report-format sarif `
      --report-path "$(Build.ArtifactStagingDirectory)\gitleaks.sarif" `
      --no-banner

    $exitCode = $LASTEXITCODE

    Write-Host "GitLeaks exit code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Error "GitLeaks detected secrets."
      exit 1
    }

    Write-Host "GitLeaks scan passed."

  displayName: 'GitLeaks - Secret Scan'


# ============================================================
# 4. CHECKOV IaC SECURITY SCAN
# ============================================================

- powershell: |
    $pythonPath = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonPath\Scripts"

    $env:PATH = "$pythonScripts;$pythonPath;$env:PATH"

    Write-Host "=============================================="
    Write-Host "Running Checkov IaC Security Scan"
    Write-Host "=============================================="

    New-Item `
      -ItemType Directory `
      -Force `
      -Path "$(Build.ArtifactStagingDirectory)" | Out-Null

    Write-Host ""
    Write-Host "Checkov version:"
    checkov --version

    Write-Host ""
    Write-Host "Scanning Terraform code:"
    Write-Host "$(Build.SourcesDirectory)\23-08-26"

    checkov `
      -d "$(Build.SourcesDirectory)\23-08-26" `
      --framework terraform `
      --skip-check CKV_AZURE_50 `
      --output cli `
      --output sarif `
      --output-file-path "$(Build.ArtifactStagingDirectory)\checkov.sarif"

    $checkovExitCode = $LASTEXITCODE

    Write-Host ""
    Write-Host "=============================================="
    Write-Host "CHECKOV EXIT CODE: $checkovExitCode"
    Write-Host "=============================================="

    if ($checkovExitCode -ne 0) {
      Write-Error "Checkov found security issues."
      exit 1
    }

    Write-Host "Checkov security scan passed."

  displayName: 'Checkov - IaC Security Scan'


# ============================================================
# 5. SNYK IaC SECURITY SCAN
# ============================================================

- powershell: |
    $nodePath = "C:\Program Files\nodejs"
    $snykPath = "C:\Users\Niklesh k\AppData\Roaming\npm"

    $env:PATH = "$nodePath;$snykPath;$env:PATH"

    Write-Host "=============================================="
    Write-Host "Running Snyk IaC Security Scan"
    Write-Host "=============================================="

    Write-Host ""
    Write-Host "Snyk version:"
    snyk.cmd --version

    if (-not $env:SNYK_TOKEN) {
      Write-Error "SNYK_TOKEN is not configured in Azure DevOps."
      exit 1
    }

    Write-Host ""
    Write-Host "Authenticating Snyk..."

    snyk.cmd auth $env:SNYK_TOKEN

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Snyk authentication failed."
      exit 1
    }

    Write-Host ""
    Write-Host "Running Snyk IaC scan..."

    snyk.cmd iac test "$(Build.SourcesDirectory)\23-08-26"

    $snykExitCode = $LASTEXITCODE

    Write-Host ""
    Write-Host "Snyk exit code: $snykExitCode"

    if ($snykExitCode -ne 0) {
      Write-Error "Snyk IaC scan found security issues."
      exit 1
    }

    Write-Host "Snyk IaC scan passed."

  displayName: 'Snyk - IaC Security Scan'

  env:
    SNYK_TOKEN: $(SNYK_TOKEN)


# ============================================================
# 6. TERRAFORM FORMAT CHECK
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "=============================================="
    Write-Host "Terraform Format Check"
    Write-Host "=============================================="

    terraform fmt -check -recursive

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform format check failed."
      exit 1
    }

    Write-Host "Terraform format check passed."

  displayName: 'Terraform - Format Check'


# ============================================================
# 7. TERRAFORM INIT
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "=============================================="
    Write-Host "Terraform Init"
    Write-Host "=============================================="

    terraform init -input=false

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform init failed."
      exit 1
    }

    Write-Host "Terraform init completed."

  displayName: 'Terraform - Init'


# ============================================================
# 8. TERRAFORM VALIDATE
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "=============================================="
    Write-Host "Terraform Validate"
    Write-Host "=============================================="

    terraform validate

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform validation failed."
      exit 1
    }

    Write-Host "Terraform validation passed."

  displayName: 'Terraform - Validate'


# ============================================================
# 9. PUBLISH SECURITY REPORTS
# ============================================================

- task: PublishBuildArtifacts@1
  displayName: 'Publish Security Scan Reports'
  condition: always()
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'SecurityScanReports'
    publishLocation: 'Container'


# ============================================================
# 10. CI COMPLETE
# ============================================================

- powershell: |
    Write-Host ""
    Write-Host "=============================================="
    Write-Host "       DEV CI PIPELINE COMPLETED"
    Write-Host "=============================================="

    Write-Host "Branch       : $(Build.SourceBranch)"
    Write-Host "Build        : $(Build.BuildNumber)"
    Write-Host "Environment  : DEV"

    Write-Host ""
    Write-Host "GitLeaks     : PASSED"
    Write-Host "Checkov      : PASSED"
    Write-Host "Snyk IaC     : PASSED"
    Write-Host "Terraform fmt: PASSED"
    Write-Host "Terraform init: PASSED"
    Write-Host "Terraform validate: PASSED"

    Write-Host ""
    Write-Host "DEV CI PIPELINE COMPLETED SUCCESSFULLY."

  displayName: 'CI Pipeline Completed'

