trigger:
- feature

pool:
  name: Terraform-Agent-Pool

variables:
  TF_IN_AUTOMATION: 'true'
  TF_WORKING_DIR: '23-08-26/env/dev'

steps:

# ============================================================
# 1. CHECKOUT SOURCE CODE
# ============================================================

- checkout: self
  clean: true
  displayName: 'Checkout Source Code'


# ============================================================
# 2. CONFIGURE TOOL PATHS + VERIFY ALL TOOLS
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "CONFIGURING DEVSECOPS TOOL PATHS"
    Write-Host "============================================================"

    $pythonPath = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonPath\Scripts"

    $nodePath = "C:\Program Files\nodejs"

    $snykPath = "C:\Users\Niklesh k\AppData\Roaming\npm"

    $gitLeaksPath = "C:\Users\Niklesh k\AppData\Local\Microsoft\WinGet\Packages\Gitleaks.Gitleaks_Microsoft.Winget.Source_8wekyb3d8bbwe"

    $env:PATH = "$pythonPath;$pythonScripts;$nodePath;$snykPath;$gitLeaksPath;$env:PATH"

    Write-Host "PATH configured."

    Write-Host ""
    Write-Host "Git:"
    git --version

    Write-Host ""
    Write-Host "Terraform:"
    terraform version

    Write-Host ""
    Write-Host "Azure CLI:"
    az version

    Write-Host ""
    Write-Host "Python:"
    python --version

    Write-Host ""
    Write-Host "Checkov:"
    checkov --version

    Write-Host ""
    Write-Host "Node:"
    node --version

    Write-Host ""
    Write-Host "NPM:"
    npm --version

    Write-Host ""
    Write-Host "Snyk:"
    snyk.cmd --version

    Write-Host ""
    Write-Host "GitLeaks:"
    gitleaks.exe version

  displayName: 'Verify All DevSecOps Tools'


# ============================================================
# 3. GITLEAKS SECRET SCAN
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "[1/9] GITLEAKS - SECRET SCAN"
    Write-Host "============================================================"

    $gitLeaksPath = "C:\Users\Niklesh k\AppData\Local\Microsoft\WinGet\Packages\Gitleaks.Gitleaks_Microsoft.Winget.Source_8wekyb3d8bbwe\gitleaks.exe"

    if (-not (Test-Path $gitLeaksPath)) {
        Write-Error "GitLeaks executable not found."
        exit 1
    }

    New-Item -ItemType Directory `
      -Force `
      -Path "$(Build.ArtifactStagingDirectory)" | Out-Null

    & $gitLeaksPath detect `
      --source "$(Build.SourcesDirectory)" `
      --report-format sarif `
      --report-path "$(Build.ArtifactStagingDirectory)\gitleaks.sarif" `
      --no-banner

    $exitCode = $LASTEXITCODE

    Write-Host "GitLeaks Exit Code: $exitCode"

    if ($exitCode -ne 0) {
        Write-Error "GitLeaks detected secrets."
        exit 1
    }

    Write-Host "GitLeaks scan passed."

  displayName: 'GitLeaks - Secret Scan'


# ============================================================
# 4. CHECKOV - RESOURCE GROUP
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "[2/9] CHECKOV - RESOURCE GROUP"
    Write-Host "============================================================"

    $path = "$(Build.SourcesDirectory)\23-08-26\module\rg"

    if (-not (Test-Path $path)) {
        Write-Error "Resource Group module not found: $path"
        exit 1
    }

    Write-Host "Scanning path:"
    Write-Host $path

    checkov `
      -d "$path" `
      --framework terraform

    $exitCode = $LASTEXITCODE

    Write-Host "Resource Group Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
        Write-Error "Resource Group Checkov scan failed."
        exit 1
    }

    Write-Host "RESOURCE GROUP SCAN PASSED."

  displayName: 'Checkov - Resource Group'


# ============================================================
# 5. CHECKOV - VNET
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "[3/9] CHECKOV - VNET"
    Write-Host "============================================================"

    $path = "$(Build.SourcesDirectory)\23-08-26\module\vnet"

    if (-not (Test-Path $path)) {
        Write-Error "VNET module not found: $path"
        exit 1
    }

    Write-Host "Scanning path:"
    Write-Host $path

    checkov `
      -d "$path" `
      --framework terraform

    $exitCode = $LASTEXITCODE

    Write-Host "VNET Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
        Write-Error "VNET Checkov scan failed."
        exit 1
    }

    Write-Host "VNET SCAN PASSED."

  displayName: 'Checkov - VNET'


# ============================================================
# 6. CHECKOV - SUBNET
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "[4/9] CHECKOV - SUBNET"
    Write-Host "============================================================"

    $path = "$(Build.SourcesDirectory)\23-08-26\module\subnet"

    if (-not (Test-Path $path)) {
        Write-Error "Subnet module not found: $path"
        exit 1
    }

    Write-Host "Scanning path:"
    Write-Host $path

    checkov `
      -d "$path" `
      --framework terraform

    $exitCode = $LASTEXITCODE

    Write-Host "Subnet Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
        Write-Error "Subnet Checkov scan failed."
        exit 1
    }

    Write-Host "SUBNET SCAN PASSED."

  displayName: 'Checkov - Subnet'


# ============================================================
# 7. CHECKOV - PUBLIC IP
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "[5/9] CHECKOV - PUBLIC IP"
    Write-Host "============================================================"

    $path = "$(Build.SourcesDirectory)\23-08-26\module\pip"

    if (-not (Test-Path $path)) {
        Write-Error "Public IP module not found: $path"
        Write-Error "Check the exact folder name under module."
        exit 1
    }

    Write-Host "Scanning path:"
    Write-Host $path

    checkov `
      -d "$path" `
      --framework terraform

    $exitCode = $LASTEXITCODE

    Write-Host "Public IP Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
        Write-Error "Public IP Checkov scan failed."
        exit 1
    }

    Write-Host "PUBLIC IP SCAN PASSED."

  displayName: 'Checkov - Public IP'


# ============================================================
# 8. CHECKOV - NIC
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "[6/9] CHECKOV - NIC"
    Write-Host "============================================================"

    $path = "$(Build.SourcesDirectory)\23-08-26\module\nic"

    if (-not (Test-Path $path)) {
        Write-Error "NIC module not found: $path"
        exit 1
    }

    Write-Host "Scanning path:"
    Write-Host $path

    checkov `
      -d "$path" `
      --framework terraform

    $exitCode = $LASTEXITCODE

    Write-Host "NIC Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
        Write-Error "NIC Checkov scan failed."
        exit 1
    }

    Write-Host "NIC SCAN PASSED."

  displayName: 'Checkov - NIC'


# ============================================================
# 9. CHECKOV - NSG
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "[7/9] CHECKOV - NSG"
    Write-Host "============================================================"

    $path = "$(Build.SourcesDirectory)\23-08-26\module\nsg"

    if (-not (Test-Path $path)) {
        Write-Error "NSG module not found: $path"
        exit 1
    }

    Write-Host "Scanning path:"
    Write-Host $path

    checkov `
      -d "$path" `
      --framework terraform

    $exitCode = $LASTEXITCODE

    Write-Host "NSG Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
        Write-Error "NSG Checkov scan failed."
        exit 1
    }

    Write-Host "NSG SCAN PASSED."

  displayName: 'Checkov - NSG'


# ============================================================
# 10. CHECKOV - VM
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "[8/9] CHECKOV - VM"
    Write-Host "============================================================"

    $path = "$(Build.SourcesDirectory)\23-08-26\module\vm"

    if (-not (Test-Path $path)) {
        Write-Error "VM module not found: $path"
        exit 1
    }

    Write-Host "Scanning path:"
    Write-Host $path

    checkov `
      -d "$path" `
      --framework terraform

    $exitCode = $LASTEXITCODE

    Write-Host "VM Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
        Write-Error "VM Checkov scan failed."
        exit 1
    }

    Write-Host "VM SCAN PASSED."

  displayName: 'Checkov - VM'


# ============================================================
# 11. SNYK IaC SCAN
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "[9/9] SNYK - IaC SECURITY SCAN"
    Write-Host "============================================================"

    $path = "$(Build.SourcesDirectory)\23-08-26"

    if (-not (Test-Path $path)) {
        Write-Error "Terraform source path not found: $path"
        exit 1
    }

    Write-Host "Scanning path:"
    Write-Host $path

    snyk.cmd auth $env:SNYK_TOKEN

    snyk.cmd iac test "$path"

    $exitCode = $LASTEXITCODE

    Write-Host "Snyk Exit Code: $exitCode"

    if ($exitCode -ne 0) {
        Write-Warning "Snyk found security issues."
        Write-Warning "Testing mode enabled."
        Write-Warning "Pipeline will continue despite Snyk findings."
        exit 0
    }

    Write-Host "Snyk IaC scan passed."

  displayName: 'Snyk - IaC Security Scan'
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)


# ============================================================
# 12. TERRAFORM FORMAT
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "TERRAFORM FORMAT CHECK"
    Write-Host "============================================================"

    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    terraform fmt -check -recursive

    if ($LASTEXITCODE -ne 0) {
        Write-Error "Terraform format check failed."
        exit 1
    }

    Write-Host "Terraform format check passed."

  displayName: 'Terraform - Format Check'


# ============================================================
# 13. TERRAFORM INIT
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "TERRAFORM INIT"
    Write-Host "============================================================"

    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    terraform init -input=false

    if ($LASTEXITCODE -ne 0) {
        Write-Error "Terraform init failed."
        exit 1
    }

    Write-Host "Terraform init completed."

  displayName: 'Terraform - Init'


# ============================================================
# 14. TERRAFORM VALIDATE
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "TERRAFORM VALIDATE"
    Write-Host "============================================================"

    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    terraform validate

    if ($LASTEXITCODE -ne 0) {
        Write-Error "Terraform validation failed."
        exit 1
    }

    Write-Host "Terraform validation passed."

  displayName: 'Terraform - Validate'


# ============================================================
# 15. PUBLISH SECURITY REPORTS
# ============================================================

- task: PublishBuildArtifacts@1
  displayName: 'Publish Security Scan Reports'
  condition: always()
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'SecurityScanReports'
    publishLocation: 'Container'


# ============================================================
# 16. CI COMPLETE
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "       DEV CI PIPELINE COMPLETED"
    Write-Host "============================================================"

    Write-Host "Branch      : $(Build.SourceBranch)"
    Write-Host "Build       : $(Build.BuildNumber)"
    Write-Host "Environment : DEV"

  displayName: 'CI Pipeline Completed'