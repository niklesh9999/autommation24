trigger:
  branches:
    include:
      - features

pool:
  name: Terraform-Agent-Pool

variables:
  TF_IN_AUTOMATION: 'true'
  TF_WORKING_DIR: '23-08-26/env/dev'

steps:

# ============================================================
# 1. CHECKOUT SOURCE CODE
# ============================================================

- checkout: self
  clean: true
  displayName: 'Checkout source code'


# ============================================================
# 2. VERIFY BASIC TOOLS
# ============================================================

- powershell: |
    Write-Host "===================================="
    Write-Host "Checking basic tools"
    Write-Host "===================================="

    Write-Host "`nGit:"
    git --version

    Write-Host "`nTerraform:"
    terraform version

    Write-Host "`nAzure CLI:"
    az version
  displayName: 'Verify Git Terraform Azure CLI'


# ============================================================
# 3. INSTALL GITLEAKS
# ============================================================

- powershell: |
    Write-Host "===================================="
    Write-Host "Installing GitLeaks"
    Write-Host "===================================="

    $release = Invoke-RestMethod `
      -Uri "https://api.github.com/repos/gitleaks/gitleaks/releases/latest"

    $asset = $release.assets |
      Where-Object {
        $_.name -match "windows_x64\.zip$"
      } |
      Select-Object -First 1

    if (-not $asset) {
      Write-Error "GitLeaks Windows x64 package not found."
      exit 1
    }

    $zip = "$(Agent.TempDirectory)\gitleaks.zip"
    $folder = "$(Agent.TempDirectory)\gitleaks"

    Invoke-WebRequest `
      -Uri $asset.browser_download_url `
      -OutFile $zip

    New-Item `
      -ItemType Directory `
      -Force `
      -Path $folder | Out-Null

    Expand-Archive `
      -Path $zip `
      -DestinationPath $folder `
      -Force

    $exe = Get-ChildItem `
      -Path $folder `
      -Filter "gitleaks.exe" `
      -Recurse |
      Select-Object -First 1

    if (-not $exe) {
      Write-Error "gitleaks.exe was not found."
      exit 1
    }

    Write-Host "GitLeaks location:"
    Write-Host $exe.FullName

    & $exe.FullName version

    Write-Host "##vso[task.setvariable variable=GITLEAKS_EXE]$($exe.FullName)"
  displayName: 'Install GitLeaks'


# ============================================================
# 4. GITLEAKS SECRET SCAN
# ============================================================

- powershell: |
    Write-Host "===================================="
    Write-Host "Running GitLeaks"
    Write-Host "===================================="

    & "$(GITLEAKS_EXE)" detect `
      --source "$(Build.SourcesDirectory)" `
      --report-format sarif `
      --report-path "$(Build.ArtifactStagingDirectory)\gitleaks.sarif" `
      --no-banner

    if ($LASTEXITCODE -ne 0) {
      Write-Error "GitLeaks detected secrets."
      exit 1
    }
  displayName: 'GitLeaks - Secret Scan'


# ============================================================
# 5. INSTALL PYTHON
# ============================================================

- powershell: |
    Write-Host "===================================="
    Write-Host "Installing Python"
    Write-Host "===================================="

    $pythonUrl = "https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe"
    $installer = "$(Agent.TempDirectory)\python-installer.exe"

    Invoke-WebRequest `
      -Uri $pythonUrl `
      -OutFile $installer

    Start-Process `
      -FilePath $installer `
      -ArgumentList "/quiet InstallAllUsers=1 PrependPath=1 Include_test=0" `
      -Wait

    $pythonDir = "C:\Program Files\Python312"
    $scriptsDir = "C:\Program Files\Python312\Scripts"

    $env:Path = "$pythonDir;$scriptsDir;$env:Path"

    python --version

    python -m pip --version
  displayName: 'Install Python'


# ============================================================
# 6. INSTALL CHECKOV
# ============================================================

- powershell: |
    Write-Host "===================================="
    Write-Host "Installing Checkov"
    Write-Host "===================================="

    $pythonDir = "C:\Program Files\Python312"
    $scriptsDir = "C:\Program Files\Python312\Scripts"

    $env:Path = "$pythonDir;$scriptsDir;$env:Path"

    python -m pip install --upgrade pip

    python -m pip install checkov

    checkov --version
  displayName: 'Install Checkov'


# ============================================================
# 7. CHECKOV TERRAFORM SECURITY SCAN
# ============================================================

- powershell: |
    Write-Host "===================================="
    Write-Host "Running Checkov"
    Write-Host "===================================="

    $pythonDir = "C:\Program Files\Python312"
    $scriptsDir = "C:\Program Files\Python312\Scripts"

    $env:Path = "$pythonDir;$scriptsDir;$env:Path"

    checkov `
      -d "$(Build.SourcesDirectory)\23-08-26" `
      --framework terraform `
      --output cli `
      --output sarif `
      --output-file-path "$(Build.ArtifactStagingDirectory)\checkov.sarif"

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Checkov security scan failed."
      exit 1
    }
  displayName: 'Checkov - IaC Security Scan'


# ============================================================
# 8. INSTALL NODE.JS
# ============================================================

- powershell: |
    Write-Host "===================================="
    Write-Host "Installing Node.js"
    Write-Host "===================================="

    $nodeUrl = "https://nodejs.org/dist/v22.18.0/node-v22.18.0-x64.msi"
    $installer = "$(Agent.TempDirectory)\nodejs.msi"

    Invoke-WebRequest `
      -Uri $nodeUrl `
      -OutFile $installer

    Start-Process `
      -FilePath "msiexec.exe" `
      -ArgumentList "/i `"$installer`" /qn /norestart" `
      -Wait

    $nodePath = "C:\Program Files\nodejs"

    $env:Path = "$nodePath;$env:Path"

    node --version
    npm --version
  displayName: 'Install Node.js'


# ============================================================
# 9. INSTALL SNYK
# ============================================================

- powershell: |
    Write-Host "===================================="
    Write-Host "Installing Snyk"
    Write-Host "===================================="

    $nodePath = "C:\Program Files\nodejs"

    $env:Path = "$nodePath;$env:Path"

    npm install --global snyk

    snyk --version
  displayName: 'Install Snyk'


# ============================================================
# 10. SNYK IaC SCAN
# ============================================================

- powershell: |
    Write-Host "===================================="
    Write-Host "Running Snyk IaC Scan"
    Write-Host "===================================="

    if (-not $env:SNYK_TOKEN) {
      Write-Warning "SNYK_TOKEN is not configured."
      Write-Warning "Skipping Snyk scan."
      exit 0
    }

    snyk auth $env:SNYK_TOKEN

    snyk iac test "$(Build.SourcesDirectory)\23-08-26"

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Snyk IaC scan failed."
      exit 1
    }
  displayName: 'Snyk - IaC Security Scan'
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)


# ============================================================
# 11. TERRAFORM FORMAT
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "===================================="
    Write-Host "Terraform Format Check"
    Write-Host "===================================="

    terraform fmt -check -recursive

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform format check failed."
      exit 1
    }
  displayName: 'Terraform - Format Check'


# ============================================================
# 12. TERRAFORM INIT
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "===================================="
    Write-Host "Terraform Init"
    Write-Host "===================================="

    terraform init -input=false
  displayName: 'Terraform - Init'


# ============================================================
# 13. TERRAFORM VALIDATE
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "===================================="
    Write-Host "Terraform Validate"
    Write-Host "===================================="

    terraform validate

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform validation failed."
      exit 1
    }
  displayName: 'Terraform - Validate'


# ============================================================
# 14. PUBLISH SECURITY REPORTS
# ============================================================

- task: PublishBuildArtifacts@1
  displayName: 'Publish Security Scan Reports'
  condition: always()
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'SecurityScanReports'
    publishLocation: 'Container'


# ============================================================
# 15. CI COMPLETE
# ============================================================

- powershell: |
    Write-Host "=============================================="
    Write-Host "       DEV CI PIPELINE COMPLETED"
    Write-Host "=============================================="

    Write-Host "Branch       : $(Build.SourceBranch)"
    Write-Host "Build        : $(Build.BuildNumber)"
    Write-Host "Environment  : DEV"
  displayName: 'CI Pipeline Completed'