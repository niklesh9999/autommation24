
trigger:
- fetaure

pool:
  name: Terraform-Agent-Pool

variables:
  TF_IN_AUTOMATION: 'true'
  TF_WORKING_DIR: '23-08-26/env/dev'

steps:

# ============================================================
# 1. CHECKOUT
# ============================================================

- checkout: self
  clean: true
  displayName: 'Checkout source code'


# ============================================================
# 2. CONFIGURE DEVSECOPS TOOL PATHS
# ============================================================

- powershell: |

    Write-Host "=============================================="
    Write-Host "CONFIGURING DEVSECOPS TOOL PATHS"
    Write-Host "=============================================="

    # Python
    $pythonHome = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonHome\Scripts"

    # Add Python and Scripts to PATH
    $env:Path = "$pythonHome;$pythonScripts;$env:Path"

    Write-Host "PATH configured."
    Write-Host ""

    Write-Host "Python:"
    & "$pythonHome\python.exe" --version

    Write-Host ""
    Write-Host "Checkov:"
    & "$pythonScripts\checkov.cmd" --version

    Write-Host ""
    Write-Host "GitLeaks:"
    $gitleaks = "C:\Users\Niklesh k\AppData\Local\Microsoft\WinGet\Packages\Gitleaks.Gitleaks_Microsoft.Winget.Source_8wekyb3d8bbwe\gitleaks.exe"
    & $gitleaks version

    Write-Host ""
    Write-Host "Node:"
    & "C:\Program Files\nodejs\node.exe" --version

    Write-Host ""
    Write-Host "Snyk:"
    & "C:\Users\Niklesh k\AppData\Roaming\npm\snyk.cmd" --version

    Write-Host ""
    Write-Host "Terraform:"
    terraform version

    Write-Host ""
    Write-Host "Azure CLI:"
    az version

    Write-Host ""
    Write-Host "=============================================="
    Write-Host "TOOL PATH CONFIGURATION COMPLETED"
    Write-Host "=============================================="

  displayName: 'Configure DevSecOps Tool Paths'


# ============================================================
# 3. VERIFY BASIC TOOLS
# ============================================================

- powershell: |

    $pythonHome = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonHome\Scripts"

    $env:Path = "$pythonHome;$pythonScripts;$env:Path"

    Write-Host "=============================================="
    Write-Host "VERIFY BASIC TOOLS"
    Write-Host "=============================================="

    Write-Host "`nGit:"
    git --version

    Write-Host "`nPython:"
    & "$pythonHome\python.exe" --version

    Write-Host "`nTerraform:"
    terraform version

    Write-Host "`nAzure CLI:"
    az version

    Write-Host "`nNode:"
    & "C:\Program Files\nodejs\node.exe" --version

    Write-Host "`nNPM:"
    & "C:\Program Files\nodejs\npm.cmd" --version

  displayName: 'Verify Basic Tools'


# ============================================================
# 4. GITLEAKS SECRET SCAN
# ============================================================

- powershell: |

    Write-Host "=============================================="
    Write-Host "[1/9] GITLEAKS SECRET SCAN"
    Write-Host "=============================================="

    $gitleaks = "C:\Users\Niklesh k\AppData\Local\Microsoft\WinGet\Packages\Gitleaks.Gitleaks_Microsoft.Winget.Source_8wekyb3d8bbwe\gitleaks.exe"

    New-Item `
      -ItemType Directory `
      -Force `
      -Path "$(Build.ArtifactStagingDirectory)" | Out-Null

    Write-Host "Gitleaks version:"
    & $gitleaks version

    Write-Host ""
    Write-Host "Scanning:"
    Write-Host "$(Build.SourcesDirectory)"

    & $gitleaks detect `
      --source "$(Build.SourcesDirectory)" `
      --report-format sarif `
      --report-path "$(Build.ArtifactStagingDirectory)\gitleaks.sarif" `
      --no-banner

    $exitCode = $LASTEXITCODE

    Write-Host ""
    Write-Host "Gitleaks Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Warning "Gitleaks found security issues."
      Write-Warning "TESTING MODE: Pipeline will continue."
    }
    else {
      Write-Host "Gitleaks scan passed."
    }

  displayName: 'GitLeaks - Secret Scan'


# ============================================================
# 5. CHECKOV - RESOURCE GROUP
# ============================================================

- powershell: |

    $pythonHome = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonHome\Scripts"
    $checkov = "$pythonScripts\checkov.cmd"

    $env:Path = "$pythonHome;$pythonScripts;$env:Path"

    Write-Host "============================================================"
    Write-Host "[2/9] CHECKOV - RESOURCE GROUP"
    Write-Host "============================================================"

    $path = "$(Build.SourcesDirectory)\23-08-26\module\rg"

    Write-Host "Scanning path:"
    Write-Host $path

    if (Test-Path $path) {

      & $checkov `
        -d $path `
        --framework terraform `
        --output cli

      $exitCode = $LASTEXITCODE

      Write-Host "Resource Group Checkov Exit Code: $exitCode"

      if ($exitCode -ne 0) {
        Write-Warning "Checkov found security issues in Resource Group."
        Write-Warning "TESTING MODE: Pipeline will continue."
      }
      else {
        Write-Host "Resource Group Checkov scan passed."
      }

    }
    else {
      Write-Warning "Resource Group path does not exist."
    }

  displayName: 'Checkov - Resource Group'


