trigger:
  branches:
    include:
      - features

pr:
  branches:
    include:
      - main

pool:
  name: Terraform-Agent-Pool

variables:
  TF_IN_AUTOMATION: 'true'
  TF_WORKING_DIR: '23-08-26/env/dev'

steps:

# ============================================================
# 1. CHECKOUT
# ============================================================

- checkout: self
  clean: true
  displayName: 'Checkout source code'


# ============================================================
# 2. VERIFY BASIC TOOLS
# ============================================================

- powershell: |
    Write-Host "===== Git ====="
    git --version

    Write-Host "===== Terraform ====="
    terraform version

    Write-Host "===== Azure CLI ====="
    az version
  displayName: 'Verify Git Terraform Azure CLI'


# ============================================================
# 3. INSTALL GITLEAKS
# ============================================================

- powershell: |
    Write-Host "Installing GitLeaks..."

    $release = Invoke-RestMethod `
      -Uri "https://api.github.com/repos/gitleaks/gitleaks/releases/latest"

    $asset = $release.assets |
      Where-Object { $_.name -like "*windows_x64.zip" } |
      Select-Object -First 1

    if (-not $asset) {
      Write-Error "GitLeaks Windows x64 package not found."
      exit 1
    }

    $zip = "$(Agent.TempDirectory)\gitleaks.zip"
    $folder = "$(Agent.TempDirectory)\gitleaks"

    Invoke-WebRequest `
      -Uri $asset.browser_download_url `
      -OutFile $zip

    New-Item -ItemType Directory -Force -Path $folder | Out-Null

    Expand-Archive `
      -Path $zip `
      -DestinationPath $folder `
      -Force

    $exe = Get-ChildItem `
      -Path $folder `
      -Filter "gitleaks.exe" `
      -Recurse |
      Select-Object -First 1

    if (-not $exe) {
      Write-Error "gitleaks.exe was not found."
      exit 1
    }

    Write-Host "GitLeaks installed at: $($exe.FullName)"

    & $exe.FullName version

    Write-Host "##vso[task.setvariable variable=GITLEAKS_EXE]$($exe.FullName)"
  displayName: 'Install GitLeaks'


# ============================================================
# 4. GITLEAKS SECRET SCAN
# ============================================================

- powershell: |
    Write-Host "Running GitLeaks..."

    & "$(GITLEAKS_EXE)" detect `
      --source "$(Build.SourcesDirectory)" `
      --report-format sarif `
      --report-path "$(Build.ArtifactStagingDirectory)\gitleaks.sarif" `
      --no-banner

    if ($LASTEXITCODE -ne 0) {
      Write-Error "GitLeaks detected secrets."
      exit 1
    }
  displayName: 'GitLeaks - Secret Scan'


# ============================================================
# 5. INSTALL CHECKOV
# ============================================================

- powershell: |
    Write-Host "Installing Checkov..."

    python --version
    python -m pip install --upgrade pip
    python -m pip install checkov

    checkov --version
  displayName: 'Install Checkov'


# ============================================================
# 6. CHECKOV TERRAFORM SECURITY SCAN
# ============================================================

- powershell: |
    Write-Host "Running Checkov..."

    checkov `
      -d "$(Build.SourcesDirectory)\23-08-26" `
      --framework terraform `
      --output cli `
      --output sarif `
      --output-file-path "$(Build.ArtifactStagingDirectory)\checkov.sarif"

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Checkov security scan failed."
      exit 1
    }
  displayName: 'Checkov - IaC Security Scan'


# ============================================================
# 7. INSTALL SNYK
# ============================================================

- powershell: |
    Write-Host "Installing Snyk..."

    node --version
    npm --version

    npm install --global snyk

    snyk --version
  displayName: 'Install Snyk'


# ============================================================
# 8. SNYK IaC SCAN
# ============================================================

- powershell: |
    Write-Host "Running Snyk IaC scan..."

    if (-not $env:SNYK_TOKEN) {
      Write-Warning "SNYK_TOKEN is not configured."
      Write-Warning "Skipping Snyk scan."
      exit 0
    }

    snyk auth $env:SNYK_TOKEN

    snyk iac test "$(Build.SourcesDirectory)\23-08-26"

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Snyk IaC scan failed."
      exit 1
    }
  displayName: 'Snyk - IaC Security Scan'
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)


# ============================================================
# 9. TERRAFORM FORMAT CHECK
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "Running Terraform fmt..."

    terraform fmt -check -recursive

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform format check failed."
      exit 1
    }
  displayName: 'Terraform - Format Check'


# ============================================================
# 10. TERRAFORM INIT
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "Running Terraform init..."

    terraform init -input=false
  displayName: 'Terraform - Init'


# ============================================================
# 11. TERRAFORM VALIDATE
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "Running Terraform validate..."

    terraform validate

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform validation failed."
      exit 1
    }
  displayName: 'Terraform - Validate'


# ============================================================
# 12. PUBLISH SECURITY REPORTS
# ============================================================

- task: PublishBuildArtifacts@1
  displayName: 'Publish Security Scan Reports'
  condition: always()
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'SecurityScanReports'
    publishLocation: 'Container'


# ============================================================
# 13. CI COMPLETE
# ============================================================

- powershell: |
    Write-Host "=============================================="
    Write-Host "       DEV CI PIPELINE COMPLETED"
    Write-Host "=============================================="
    Write-Host "Branch: $(Build.SourceBranch)"
    Write-Host "Build : $(Build.BuildNumber)"
    Write-Host "Environment: DEV"
  displayName: 'CI Pipeline Completed'