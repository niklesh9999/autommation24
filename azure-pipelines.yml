
trigger:
- fetaure

pool:
  name: Terraform-Agent-Pool

variables:
  TF_IN_AUTOMATION: 'true'
  TF_WORKING_DIR: '23-08-26/env/dev'

steps:

# ============================================================
# 1. CHECKOUT SOURCE CODE
# ============================================================

- checkout: self
  clean: true
  displayName: 'Checkout source code'


# ============================================================
# 2. VERIFY ALL DEVSECOPS TOOLS
# ============================================================

- powershell: |
    $pythonPath = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonPath\Scripts"

    $gitLeaksPath = "C:\Users\Niklesh k\AppData\Local\Microsoft\WinGet\Packages\Gitleaks.Gitleaks_Microsoft.Winget.Source_8wekyb3d8bbwe"

    $nodePath = "C:\Program Files\nodejs"
    $snykPath = "C:\Users\Niklesh k\AppData\Roaming\npm"

    $env:PATH = "$pythonScripts;$pythonPath;$gitLeaksPath;$nodePath;$snykPath;$env:PATH"

    Write-Host "============================================================"
    Write-Host "VERIFYING DEVSECOPS TOOLS"
    Write-Host "============================================================"

    Write-Host ""
    Write-Host "Git:"
    git --version

    Write-Host ""
    Write-Host "Terraform:"
    terraform version

    Write-Host ""
    Write-Host "Azure CLI:"
    az version

    Write-Host ""
    Write-Host "Python:"
    python --version

    Write-Host ""
    Write-Host "Checkov:"
    checkov --version

    Write-Host ""
    Write-Host "GitLeaks:"
    gitleaks version

    Write-Host ""
    Write-Host "Node:"
    node --version

    Write-Host ""
    Write-Host "NPM:"
    npm.cmd --version

    Write-Host ""
    Write-Host "Snyk:"
    snyk.cmd --version

    Write-Host ""
    Write-Host "============================================================"
    Write-Host "ALL TOOLS VERIFIED"
    Write-Host "============================================================"

  displayName: 'Verify All DevSecOps Tools'


# ============================================================
# 3. GITLEAKS SECRET SCAN
# ============================================================

- powershell: |
    $gitLeaksPath = "C:\Users\Niklesh k\AppData\Local\Microsoft\WinGet\Packages\Gitleaks.Gitleaks_Microsoft.Winget.Source_8wekyb3d8bbwe"

    $env:PATH = "$gitLeaksPath;$env:PATH"

    Write-Host "============================================================"
    Write-Host "GITLEAKS SECRET SCAN"
    Write-Host "============================================================"

    New-Item `
      -ItemType Directory `
      -Force `
      -Path "$(Build.ArtifactStagingDirectory)" | Out-Null

    Write-Host "Scanning:"
    Write-Host "$(Build.SourcesDirectory)"

    gitleaks detect `
      --source "$(Build.SourcesDirectory)" `
      --report-format sarif `
      --report-path "$(Build.ArtifactStagingDirectory)\gitleaks.sarif" `
      --no-banner

    $exitCode = $LASTEXITCODE

    Write-Host ""
    Write-Host "GitLeaks Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Error "GitLeaks detected secrets."
      exit 1
    }

    Write-Host "GitLeaks scan PASSED."

  displayName: 'GitLeaks - Secret Scan'


# ============================================================
# 4. CHECKOV START
# ============================================================

- powershell: |
    $pythonPath = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonPath\Scripts"

    $env:PATH = "$pythonScripts;$pythonPath;$env:PATH"

    Write-Host ""
    Write-Host "============================================================"
    Write-Host "CHECKOV SECURITY SCAN STARTED"
    Write-Host "============================================================"

    checkov --version

  displayName: 'Checkov - Start'


# ============================================================
# 5. CHECKOV - RESOURCE GROUP
# ============================================================

- powershell: |
    $pythonPath = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonPath\Scripts"

    $env:PATH = "$pythonScripts;$pythonPath;$env:PATH"

    Write-Host ""
    Write-Host "============================================================"
    Write-Host "[1/7] CHECKOV - RESOURCE GROUP"
    Write-Host "============================================================"

    $path = "$(Build.SourcesDirectory)\23-08-26\module\rg"

    Write-Host "Scanning path:"
    Write-Host $path

    checkov `
      -d "$path" `
      --framework terraform `
      --skip-check CKV_AZURE_50 `
      --output cli

    $exitCode = $LASTEXITCODE

    Write-Host ""
    Write-Host "Resource Group Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Error "Resource Group Checkov scan failed."
      exit 1
    }

    Write-Host "RESOURCE GROUP SCAN PASSED."

  displayName: 'Checkov - Resource Group'


