
trigger:
- feature

pool:
  name: Terraform-Agent-Pool

variables:
  TF_IN_AUTOMATION: 'true'
  TF_WORKING_DIR: '23-08-26/env/dev'

steps:

# ============================================================
# 1. CHECKOUT SOURCE CODE
# ============================================================

- checkout: self
  clean: true
  displayName: 'Checkout source code'


# ============================================================
# 2. CONFIGURE DEVSECOPS TOOL PATHS
# ============================================================

- powershell: |
    Write-Host "=============================================="
    Write-Host "CONFIGURING DEVSECOPS TOOL PATHS"
    Write-Host "=============================================="

    $pythonPath = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonPath\Scripts"

    $gitleaksPath = "C:\Users\Niklesh k\AppData\Local\Microsoft\WinGet\Packages\Gitleaks.Gitleaks_Microsoft.Winget.Source_8wekyb3d8bbwe\gitleaks.exe"
    $nodePath = "C:\Program Files\nodejs\node.exe"
    $snykPath = "C:\Users\Niklesh k\AppData\Roaming\npm\snyk.cmd"

    $env:Path = "$pythonPath;$pythonScripts;C:\Program Files\nodejs;C:\Users\Niklesh k\AppData\Roaming\npm;$env:Path"

    Write-Host "PATH configured."

    Write-Host "`nPython:"
    & "$pythonPath\python.exe" --version

    Write-Host "`nCheckov:"
    & "$pythonScripts\checkov.cmd" --version

    Write-Host "`nGitLeaks:"
    & "$gitleaksPath" version

    Write-Host "`nNode:"
    & "$nodePath" --version

    Write-Host "`nNPM:"
    npm --version

    Write-Host "`nSnyk:"
    & "$snykPath" --version

    Write-Host "`nTerraform:"
    terraform version

    Write-Host "`nAzure CLI:"
    az version

  displayName: 'Configure DevSecOps Tool Paths'


# ============================================================
# 3. GITLEAKS SECRET SCAN
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "[1/9] GITLEAKS - SECRET SCAN"
    Write-Host "============================================================"

    $gitleaksPath = "C:\Users\Niklesh k\AppData\Local\Microsoft\WinGet\Packages\Gitleaks.Gitleaks_Microsoft.Winget.Source_8wekyb3d8bbwe\gitleaks.exe"

    New-Item -ItemType Directory `
      -Force `
      -Path "$(Build.ArtifactStagingDirectory)" | Out-Null

    Write-Host "Scanning:"
    Write-Host "$(Build.SourcesDirectory)"

    & "$gitleaksPath" detect `
      --source "$(Build.SourcesDirectory)" `
      --report-format sarif `
      --report-path "$(Build.ArtifactStagingDirectory)\gitleaks.sarif" `
      --no-banner

    $exitCode = $LASTEXITCODE

    Write-Host "GitLeaks Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Error "GitLeaks detected secrets."
      exit 1
    }

    Write-Host "GitLeaks scan PASSED."

  displayName: 'GitLeaks - Secret Scan'


# ============================================================
# 4. CHECKOV - RESOURCE GROUP
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "[2/9] CHECKOV - RESOURCE GROUP"
    Write-Host "============================================================"

    $checkov = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312\Scripts\checkov.cmd"
    $path = "$(Build.SourcesDirectory)\23-08-26\module\rg"

    if (-not (Test-Path $path)) {
      Write-Error "Resource Group path does not exist: $path"
      exit 1
    }

    Write-Host "Scanning path:"
    Write-Host "$path"

    & $checkov -d "$path" --framework terraform --output cli

    $exitCode = $LASTEXITCODE

    Write-Host "Resource Group Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Warning "Checkov found security issues in Resource Group."
      Write-Warning "Testing mode: pipeline will continue."
    }
    else {
      Write-Host "Resource Group Checkov scan PASSED."
    }

  displayName: 'Checkov - Resource Group'


# ============================================================
# 5. CHECKOV - VNET
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "[3/9] CHECKOV - VNET"
    Write-Host "============================================================"

    $checkov = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312\Scripts\checkov.cmd"
    $path = "$(Build.SourcesDirectory)\23-08-26\module\vnet"

    if (-not (Test-Path $path)) {
      Write-Error "VNET path does not exist: $path"
      exit 1
    }

    Write-Host "Scanning path:"
    Write-Host "$path"

    & $checkov -d "$path" --framework terraform --output cli

    $exitCode = $LASTEXITCODE

    Write-Host "VNET Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Warning "Checkov found security issues in VNET."
      Write-Warning "Testing mode: pipeline will continue."
    }
    else {
      Write-Host "VNET Checkov scan PASSED."
    }

  displayName: 'Checkov - VNET'


# ============================================================
# 6. CHECKOV - PUBLIC IP
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "[4/9] CHECKOV - PUBLIC IP"
    Write-Host "============================================================"

    $checkov = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312\Scripts\checkov.cmd"
    $path = "$(Build.SourcesDirectory)\23-08-26\module\pip"

    if (-not (Test-Path $path)) {
      Write-Warning "Public IP module path does not exist:"
      Write-Warning "$path"
      Write-Warning "Skipping Public IP scan."
      exit 0
    }

    Write-Host "Scanning path:"
    Write-Host "$path"

    & $checkov -d "$path" --framework terraform --output cli

    $exitCode = $LASTEXITCODE

    Write-Host "Public IP Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Warning "Checkov found security issues in Public IP."
      Write-Warning "Testing mode: pipeline will continue."
    }
    else {
      Write-Host "Public IP Checkov scan PASSED."
    }

  displayName: 'Checkov - Public IP'


# ============================================================
# 7. CHECKOV - NIC
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "[5/9] CHECKOV - NIC"
    Write-Host "============================================================"

    $checkov = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312\Scripts\checkov.cmd"
    $path = "$(Build.SourcesDirectory)\23-08-26\module\nic"

    if (-not (Test-Path $path)) {
      Write-Error "NIC path does not exist: $path"
      exit 1
    }

    Write-Host "Scanning path:"
    Write-Host "$path"

    & $checkov -d "$path" --framework terraform --output cli

    $exitCode = $LASTEXITCODE

    Write-Host "NIC Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Warning "Checkov found security issues in NIC."
      Write-Warning "Testing mode: pipeline will continue."
    }
    else {
      Write-Host "NIC Checkov scan PASSED."
    }

  displayName: 'Checkov - NIC'


# ============================================================
# 8. CHECKOV - SUBNET + NSG
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "[6/9] CHECKOV - SUBNET + NSG"
    Write-Host "============================================================"

    $checkov = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312\Scripts\checkov.cmd"

    $subnetPath = "$(Build.SourcesDirectory)\23-08-26\module\subnet"
    $nsgPath = "$(Build.SourcesDirectory)\23-08-26\module\nsg"

    if (Test-Path $subnetPath) {

      Write-Host "Scanning SUBNET:"
      Write-Host "$subnetPath"

      & $checkov -d "$subnetPath" --framework terraform --output cli

      Write-Host "Subnet Checkov Exit Code: $LASTEXITCODE"

      if ($LASTEXITCODE -ne 0) {
        Write-Warning "Checkov found security issues in Subnet."
      }
    }
    else {
      Write-Warning "Subnet module path does not exist."
    }

    if (Test-Path $nsgPath) {

      Write-Host ""
      Write-Host "Scanning NSG:"
      Write-Host "$nsgPath"

      & $checkov -d "$nsgPath" --framework terraform --output cli

      Write-Host "NSG Checkov Exit Code: $LASTEXITCODE"

      if ($LASTEXITCODE -ne 0) {
        Write-Warning "Checkov found security issues in NSG."
      }
    }
    else {
      Write-Warning "NSG module path does not exist."
    }

    Write-Host "Subnet + NSG scan completed."

  displayName: 'Checkov - Subnet + NSG'


# ============================================================
# 9. CHECKOV - VM
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "[7/9] CHECKOV - VM"
    Write-Host "============================================================"

    $checkov = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312\Scripts\checkov.cmd"
    $path = "$(Build.SourcesDirectory)\23-08-26\module\vm"

    if (-not (Test-Path $path)) {
      Write-Error "VM path does not exist: $path"
      exit 1
    }

    Write-Host "Scanning path:"
    Write-Host "$path"

    & $checkov -d "$path" --framework terraform --output cli

    $exitCode = $LASTEXITCODE

    Write-Host "VM Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Warning "Checkov found security issues in VM."
      Write-Warning "Testing mode: pipeline will continue."
    }
    else {
      Write-Host "VM Checkov scan PASSED."
    }

  displayName: 'Checkov - VM'


# ============================================================
# 10. SNYK IaC SCAN
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "[8/9] SNYK - IaC SECURITY SCAN"
    Write-Host "============================================================"

    $snyk = "C:\Users\Niklesh k\AppData\Roaming\npm\snyk.cmd"

    Write-Host "Snyk version:"
    & $snyk --version

    if (-not $env:SNYK_TOKEN) {
      Write-Warning "SNYK_TOKEN is not configured."
      Write-Warning "Skipping Snyk authentication."
      exit 0
    }

    Write-Host "Authenticating Snyk..."

    & $snyk auth $env:SNYK_TOKEN

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Snyk authentication failed."
      exit 1
    }

    Write-Host "Running Snyk IaC scan..."

    & $snyk iac test "$(Build.SourcesDirectory)\23-08-26"

    $exitCode = $LASTEXITCODE

    Write-Host "Snyk Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Warning "Snyk IaC scan found security issues."
      Write-Warning "Testing mode: security findings will NOT stop the pipeline."
    }
    else {
      Write-Host "Snyk IaC scan PASSED."
    }

  displayName: 'Snyk - IaC Security Scan'
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)


# ============================================================
# 11. TERRAFORM FORMAT
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "[9/9] TERRAFORM VALIDATION"
    Write-Host "============================================================"

    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "Terraform Format Check..."

    terraform fmt -check -recursive

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform format check FAILED."
      exit 1
    }

    Write-Host "Terraform format check PASSED."

    Write-Host ""
    Write-Host "Terraform Init..."

    terraform init -input=false

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform init FAILED."
      exit 1
    }

    Write-Host "Terraform init PASSED."

    Write-Host ""
    Write-Host "Terraform Validate..."

    terraform validate

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform validation FAILED."
      exit 1
    }

    Write-Host "Terraform validation PASSED."

  displayName: 'Terraform - Format Init Validate'


# ============================================================
# 12. PUBLISH SECURITY REPORTS
# ============================================================

- task: PublishBuildArtifacts@1
  displayName: 'Publish Security Scan Reports'
  condition: always()
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'SecurityScanReports'
    publishLocation: 'Container'


# ============================================================
# 13. CI COMPLETE
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "             DEV CI PIPELINE COMPLETED"
    Write-Host "============================================================"

    Write-Host "Branch      : $(Build.SourceBranch)"
    Write-Host "Build       : $(Build.BuildNumber)"
    Write-Host "Environment : DEV"

    Write-Host ""
    Write-Host "DevSecOps flow completed:"
    Write-Host "1. GitLeaks"
    Write-Host "2. Checkov - Resource Group"
    Write-Host "3. Checkov - VNET"
    Write-Host "4. Checkov - Public IP"
    Write-Host "5. Checkov - NIC"
    Write-Host "6. Checkov - Subnet + NSG"
    Write-Host "7. Checkov - VM"
    Write-Host "8. Snyk IaC"
    Write-Host "9. Terraform Format / Init / Validate"

  displayName: 'DEV CI Pipeline Completed'

