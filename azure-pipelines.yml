- powershell: |
    $pythonPath = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonPath\Scripts"

    $env:PATH = "$pythonScripts;$pythonPath;$env:PATH"

    Write-Host ""
    Write-Host "============================================================"
    Write-Host "[6/7] CHECKOV - NETWORK SECURITY GROUP"
    Write-Host "============================================================"

    $path = "$(Build.SourcesDirectory)\23-08-26\module\nsg"

    Write-Host "Scanning path:"
    Write-Host $path

    checkov `
      -d "$path" `
