trigger:
- fetaure

pool:
  name: Terraform-Agent-Pool

variables:
  TF_IN_AUTOMATION: 'true'
  TF_WORKING_DIR: '23-08-26/env/dev'

steps:

# ============================================================
# 1. CHECKOUT
# ============================================================

- checkout: self
  clean: true
  displayName: 'Checkout source code'


# ============================================================
# 2. VERIFY BASIC TOOLS
# ============================================================

- powershell: |
    Write-Host "===================================="
    Write-Host "Checking basic tools"
    Write-Host "===================================="

    git --version
    terraform version
    az version
  displayName: 'Verify Git Terraform Azure CLI'


# ============================================================
# 3. VERIFY GITLEAKS
# ============================================================

- powershell: |
    Write-Host "===================================="
    Write-Host "Checking GitLeaks"
    Write-Host "===================================="

    gitleaks version
  displayName: 'Verify GitLeaks'


# ============================================================
# 4. GITLEAKS SECRET SCAN
# ============================================================

- powershell: |
    Write-Host "===================================="
    Write-Host "Running GitLeaks Secret Scan"
    Write-Host "===================================="

    New-Item -ItemType Directory -Force `
      -Path "$(Build.ArtifactStagingDirectory)" | Out-Null

    gitleaks detect `
      --source "$(Build.SourcesDirectory)" `
      --report-format sarif `
      --report-path "$(Build.ArtifactStagingDirectory)\gitleaks.sarif" `
      --no-banner

    if ($LASTEXITCODE -ne 0) {
      Write-Error "GitLeaks detected secrets."
      exit 1
    }

    Write-Host "GitLeaks scan passed."
  displayName: 'GitLeaks - Secret Scan'


# ============================================================
# 5. PYTHON + CHECKOV
# ============================================================

- powershell: |
    Write-Host "===================================="
    Write-Host "Checking Python and Checkov"
    Write-Host "===================================="

    $pythonPath = "$env:LOCALAPPDATA\Programs\Python\Python312"
    $scriptsPath = "$pythonPath\Scripts"

    $env:Path = "$pythonPath;$scriptsPath;$env:Path"

    python --version
    python -m pip --version

    checkov --version
  displayName: 'Verify Python and Checkov'


# ============================================================
# 6. CHECKOV IaC SCAN
# ============================================================

- powershell: |
    Write-Host "===================================="
    Write-Host "Running Checkov"
    Write-Host "===================================="

    $pythonPath = "$env:LOCALAPPDATA\Programs\Python\Python312"
    $scriptsPath = "$pythonPath\Scripts"

    $env:Path = "$pythonPath;$scriptsPath;$env:Path"

    New-Item -ItemType Directory -Force `
      -Path "$(Build.ArtifactStagingDirectory)" | Out-Null

    checkov `
      -d "$(Build.SourcesDirectory)\23-08-26" `
      --framework terraform `
      --output cli `
      --output sarif `
      --output-file-path "$(Build.ArtifactStagingDirectory)\checkov.sarif"

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Checkov security scan failed."
      exit 1
    }

    Write-Host "Checkov scan passed."
  displayName: 'Checkov - IaC Security Scan'


# ============================================================
# 7. VERIFY NODE.JS + SNYK
# ============================================================

- powershell: |
    Write-Host "===================================="
    Write-Host "Checking Node.js and Snyk"
    Write-Host "===================================="

    $nodePath = "C:\Program Files\nodejs"
    $env:Path = "$nodePath;$env:Path"

    node --version
    npm.cmd --version
    snyk.cmd --version
  displayName: 'Verify Node.js and Snyk'


# ============================================================
# 8. SNYK IaC SCAN
# ============================================================

- powershell: |
    Write-Host "===================================="
    Write-Host "Running Snyk IaC Scan"
    Write-Host "===================================="

    $nodePath = "C:\Program Files\nodejs"
    $env:Path = "$nodePath;$env:Path"

    if (-not $env:SNYK_TOKEN) {
      Write-Error "SNYK_TOKEN is not configured."
      exit 1
    }

    snyk.cmd iac test "$(Build.SourcesDirectory)\23-08-26"

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Snyk IaC scan failed."
      exit 1
    }

    Write-Host "Snyk IaC scan passed."
  displayName: 'Snyk - IaC Security Scan'
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)


# ============================================================
# 9. TERRAFORM FORMAT
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "===================================="
    Write-Host "Terraform Format Check"
    Write-Host "===================================="

    terraform fmt -check -recursive

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform format check failed."
      exit 1
    }

    Write-Host "Terraform format check passed."
  displayName: 'Terraform - Format Check'


# ============================================================
# 10. TERRAFORM INIT
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "===================================="
    Write-Host "Terraform Init"
    Write-Host "===================================="

    terraform init -input=false

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform init failed."
      exit 1
    }

    Write-Host "Terraform init completed."
  displayName: 'Terraform - Init'


# ============================================================
# 11. TERRAFORM VALIDATE
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "===================================="
    Write-Host "Terraform Validate"
    Write-Host "===================================="

    terraform validate

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform validation failed."
      exit 1
    }

    Write-Host "Terraform validation passed."
  displayName: 'Terraform - Validate'


# ============================================================
# 12. PUBLISH SECURITY REPORTS
# ============================================================

- task: PublishBuildArtifacts@1
  displayName: 'Publish Security Scan Reports'
  condition: always()
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'SecurityScanReports'
    publishLocation: 'Container'


# ============================================================
# 13. CI COMPLETE
# ============================================================

- powershell: |
    Write-Host "=============================================="
    Write-Host "       DEV CI PIPELINE COMPLETED"
    Write-Host "=============================================="

    Write-Host "Branch       : $(Build.SourceBranch)"
    Write-Host "Build        : $(Build.BuildNumber)"
    Write-Host "Environment  : DEV"
  displayName: 'CI Pipeline Completed'