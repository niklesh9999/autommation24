trigger:
- fetaure

pool:
  name: Terraform-Agent-Pool

variables:
  TF_IN_AUTOMATION: 'true'
  TF_WORKING_DIR: '23-08-26/env/dev'

steps:

# ============================================================
# 1. CHECKOUT
# ============================================================

- checkout: self
  clean: true
  displayName: 'Checkout source code'


# ============================================================
# 2. CONFIGURE DEVSECOPS TOOL PATHS
# ============================================================

- powershell: |

    Write-Host "============================================================"
    Write-Host "CONFIGURING DEVSECOPS TOOL PATHS"
    Write-Host "============================================================"

    $pythonHome = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonHome\Scripts"

    $env:Path = "$pythonHome;$pythonScripts;$env:Path"

    Write-Host ""
    Write-Host "Python:"
    & "$pythonHome\python.exe" --version

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Python is not working."
      exit 1
    }

    Write-Host ""
    Write-Host "Searching Checkov installation..."

    $checkovScript = Get-ChildItem `
      -Path $pythonScripts `
      -Filter "checkov*.py" `
      -ErrorAction SilentlyContinue |
      Select-Object -First 1

    if ($null -eq $checkovScript) {
      Write-Error "Checkov Python script was not found in $pythonScripts"
      Write-Host "Available Checkov files:"
      Get-ChildItem $pythonScripts -Filter "*checkov*" -ErrorAction SilentlyContinue
      exit 1
    }

    Write-Host "Checkov script:"
    Write-Host $checkovScript.FullName

    Write-Host ""
    Write-Host "Checkov:"
    & "$pythonHome\python.exe" "$($checkovScript.FullName)" --version

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Checkov is not working through Python."
      exit 1
    }

    Write-Host ""
    Write-Host "GitLeaks:"

    $gitleaks = "C:\Users\Niklesh k\AppData\Local\Microsoft\WinGet\Packages\Gitleaks.Gitleaks_Microsoft.Winget.Source_8wekyb3d8bbwe\gitleaks.exe"

    if (Test-Path $gitleaks) {
      & $gitleaks version
    }
    else {
      Write-Warning "Gitleaks executable not found at configured path."
    }

    Write-Host ""
    Write-Host "Node:"
    & "C:\Program Files\nodejs\node.exe" --version

    Write-Host ""
    Write-Host "Snyk:"
    $snyk = "C:\Users\Niklesh k\AppData\Roaming\npm\snyk.cmd"

    if (Test-Path $snyk) {
      & $snyk --version
    }
    else {
      Write-Warning "Snyk executable not found."
    }

    Write-Host ""
    Write-Host "Terraform:"
    terraform version

    Write-Host ""
    Write-Host "Azure CLI:"
    az version

    Write-Host ""
    Write-Host "============================================================"
    Write-Host "DEVSECOPS TOOL CONFIGURATION COMPLETED"
    Write-Host "============================================================"

  displayName: 'Configure DevSecOps Tool Paths'


# ============================================================
# 3. VERIFY BASIC TOOLS
# ============================================================

- powershell: |

    $pythonHome = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonHome\Scripts"

    $env:Path = "$pythonHome;$pythonScripts;$env:Path"

    Write-Host "============================================================"
    Write-Host "VERIFY BASIC TOOLS"
    Write-Host "============================================================"

    Write-Host ""
    Write-Host "Git:"
    git --version

    Write-Host ""
    Write-Host "Python:"
    & "$pythonHome\python.exe" --version

    Write-Host ""
    Write-Host "Terraform:"
    terraform version

    Write-Host ""
    Write-Host "Azure CLI:"
    az version

    Write-Host ""
    Write-Host "Node:"
    & "C:\Program Files\nodejs\node.exe" --version

    Write-Host ""
    Write-Host "NPM:"
    & "C:\Program Files\nodejs\npm.cmd" --version

    Write-Host ""
    Write-Host "============================================================"
    Write-Host "BASIC TOOL VERIFICATION COMPLETED"
    Write-Host "============================================================"

  displayName: 'Verify Basic Tools'


# ============================================================
# 4. GITLEAKS SECRET SCAN
# ============================================================

- powershell: |

    Write-Host "============================================================"
    Write-Host "[1/9] GITLEAKS SECRET SCAN"
    Write-Host "============================================================"

    $gitleaks = "C:\Users\Niklesh k\AppData\Local\Microsoft\WinGet\Packages\Gitleaks.Gitleaks_Microsoft.Winget.Source_8wekyb3d8bbwe\gitleaks.exe"

    if (-not (Test-Path $gitleaks)) {
      Write-Warning "Gitleaks executable not found."
      Write-Warning "TESTING MODE: Pipeline will continue."
      exit 0
    }

    New-Item `
      -ItemType Directory `
      -Force `
      -Path "$(Build.ArtifactStagingDirectory)" | Out-Null

    Write-Host "Gitleaks version:"
    & $gitleaks version

    Write-Host ""
    Write-Host "Scanning:"
    Write-Host "$(Build.SourcesDirectory)"

    & $gitleaks detect `
      --source "$(Build.SourcesDirectory)" `
      --report-format sarif `
      --report-path "$(Build.ArtifactStagingDirectory)\gitleaks.sarif" `
      --no-banner

    $exitCode = $LASTEXITCODE

    Write-Host ""
    Write-Host "Gitleaks Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Warning "Gitleaks found security issues."
      Write-Warning "TESTING MODE: Pipeline will continue."
    }
    else {
      Write-Host "Gitleaks scan passed."
    }

    exit 0

  displayName: 'GitLeaks - Secret Scan'


# ============================================================
# 5. CHECKOV - RESOURCE GROUP
# ============================================================

- powershell: |

    $pythonHome = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonHome\Scripts"

    $env:Path = "$pythonHome;$pythonScripts;$env:Path"

    Write-Host "============================================================"
    Write-Host "[2/9] CHECKOV - RESOURCE GROUP"
    Write-Host "============================================================"

    $path = "$(Build.SourcesDirectory)\23-08-26\module\rg"
    $pythonExe = "$pythonHome\python.exe"

    $checkovScript = Get-ChildItem `
      -Path $pythonScripts `
      -Filter "checkov*.py" `
      -ErrorAction SilentlyContinue |
      Select-Object -First 1

    Write-Host "Scanning path:"
    Write-Host $path

    if (-not (Test-Path $path)) {
      Write-Warning "Resource Group path does not exist."
      exit 0
    }

    if ($null -eq $checkovScript) {
      Write-Warning "Checkov Python script not found."
      Write-Warning "TESTING MODE: Pipeline will continue."
      exit 0
    }

    & $pythonExe "$($checkovScript.FullName)" `
      -d $path `
      --framework terraform `
      --output cli

    $exitCode = $LASTEXITCODE

    Write-Host "Resource Group Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Warning "Checkov found Resource Group security issues."
      Write-Warning "TESTING MODE: Pipeline will continue."
    }
    else {
      Write-Host "Resource Group Checkov scan passed."
    }

    exit 0

  displayName: 'Checkov - Resource Group'


