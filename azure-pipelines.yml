trigger:
  branches:
    include:
      - features

pr:
  branches:
    include:
      - main

pool:
  name: Terraform-Agent-Pool

variables:
  TF_IN_AUTOMATION: 'true'
  TF_WORKING_DIR: '23-08-26/env/dev'

steps:

# ============================================================
# 1. CHECKOUT
# ============================================================

- checkout: self
  clean: true
  displayName: 'Checkout source code'


# ============================================================
# 2. VERIFY TOOLS
# ============================================================

- powershell: |
    Write-Host "===================================="
    Write-Host "Checking installed tools"
    Write-Host "===================================="

    Write-Host "`nGit:"
    git --version

    Write-Host "`nTerraform:"
    terraform version

    Write-Host "`nAzure CLI:"
    az version

    Write-Host "`nGitLeaks:"
    gitleaks version

    Write-Host "`nCheckov:"
    checkov --version

    Write-Host "`nSnyk:"
    snyk --version

    Write-Host "`nSonarScanner:"
    sonar-scanner --version
  displayName: 'Verify required DevSecOps tools'


# ============================================================
# 3. GITLEAKS - SECRET SCAN
# ============================================================

- powershell: |
    Write-Host "Running GitLeaks..."

    gitleaks detect `
      --source "$(Build.SourcesDirectory)" `
      --report-format sarif `
      --report-path "$(Build.ArtifactStagingDirectory)\gitleaks.sarif" `
      --no-banner

    if ($LASTEXITCODE -ne 0) {
      Write-Error "GitLeaks detected secrets."
      exit 1
    }
  displayName: 'GitLeaks - Secret Scan'


# ============================================================
# 4. TERRAFORM FORMAT
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "Running Terraform Format Check..."

    terraform fmt -check -recursive

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform format check failed."
      exit 1
    }
  displayName: 'Terraform - Format Check'


# ============================================================
# 5. TERRAFORM INIT
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "Running Terraform Init..."

    terraform init -input=false
  displayName: 'Terraform - Init'


# ============================================================
# 6. TERRAFORM VALIDATE
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "Running Terraform Validate..."

    terraform validate
  displayName: 'Terraform - Validate'


# ============================================================
# 7. CHECKOV - IaC SECURITY SCAN
# ============================================================

- powershell: |
    Write-Host "Running Checkov..."

    checkov `
      -d "$(Build.SourcesDirectory)\23-08-26" `
      --framework terraform `
      --output cli `
      --output sarif `
      --output-file-path "$(Build.ArtifactStagingDirectory)\checkov.sarif"

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Checkov security scan failed."
      exit 1
    }
  displayName: 'Checkov - IaC Security Scan'


# ============================================================
# 8. SNYK - IaC SECURITY SCAN
# ============================================================

- powershell: |
    Write-Host "Running Snyk IaC Scan..."

    snyk iac test "$(Build.SourcesDirectory)\23-08-26"

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Snyk IaC scan failed."
      exit 1
    }
  displayName: 'Snyk - IaC Security Scan'


# ============================================================
# 9. SONARSCANNER
# ============================================================

- powershell: |
    Write-Host "Running SonarScanner..."

    sonar-scanner `
      "-Dsonar.projectKey=terraform-dev" `
      "-Dsonar.projectName=terraform-dev" `
      "-Dsonar.sources=$(Build.SourcesDirectory)\23-08-26"

    if ($LASTEXITCODE -ne 0) {
      Write-Error "SonarScanner failed."
      exit 1
    }
  displayName: 'SonarQube - Static Analysis'


# ============================================================
# 10. PUBLISH SCAN REPORTS
# ============================================================

- task: PublishBuildArtifacts@1
  displayName: 'Publish Security Scan Reports'
  condition: always()
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'SecurityScanReports'
    publishLocation: 'Container'


# ============================================================
# 11. CI COMPLETED
# ============================================================

- powershell: |
    Write-Host "=========================================="
    Write-Host "       DEV CI PIPELINE COMPLETED"
    Write-Host "=========================================="

    Write-Host "Branch       : $(Build.SourceBranch)"
    Write-Host "Build Number : $(Build.BuildNumber)"
    Write-Host "Environment  : DEV"
  displayName: 'CI Pipeline Completed'