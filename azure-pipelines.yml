    $env:PATH = "$pythonScripts;$pythonPath;$env:PATH"

    Write-Host ""
    Write-Host "============================================================"
    Write-Host "[2/7] CHECKOV - VIRTUAL NETWORK"
    Write-Host "============================================================"

