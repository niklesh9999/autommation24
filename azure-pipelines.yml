trigger:
- feature

pool:
  name: Terraform-Agent-Pool

variables:
  TF_IN_AUTOMATION: 'true'
  TF_WORKING_DIR: '23-08-26/env/dev'

steps:

# ============================================================
# 1. CHECKOUT
# ============================================================

- checkout: self
  clean: true
  displayName: 'Checkout Source Code'


# ============================================================
# 2. CONFIGURE DEVSECOPS TOOL PATHS
# ============================================================

- powershell: |
    Write-Host "=============================================="
    Write-Host "CONFIGURING DEVSECOPS TOOL PATHS"
    Write-Host "=============================================="

    $pythonPath = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonPath\Scripts"
    $nodePath = "C:\Program Files\nodejs"
    $npmPath = "C:\Users\Niklesh k\AppData\Roaming\npm"
    $gitLeaksPath = "C:\Users\Niklesh k\AppData\Local\Microsoft\WinGet\Packages\Gitleaks.Gitleaks_Microsoft.Winget.Source_8wekyb3d8bbwe"

    $env:Path = "$pythonPath;$pythonScripts;$nodePath;$npmPath;$gitLeaksPath;$env:Path"

    Write-Host "PATH configured."

    Write-Host "`nPython:"
    & "$pythonPath\python.exe" --version

    Write-Host "`nCheckov:"
    & "$pythonScripts\checkov.exe" --version

    Write-Host "`nGitLeaks:"
    & "$gitLeaksPath\gitleaks.exe" version

    Write-Host "`nNode:"
    & "$nodePath\node.exe" --version

    Write-Host "`nSnyk:"
    & "$npmPath\snyk.cmd" --version

    Write-Host "`nTerraform:"
    terraform version

    Write-Host "`nAzure CLI:"
    az version

  displayName: 'Configure DevSecOps Tool Paths'


# ============================================================
# 3. VERIFY BASIC TOOLS
# ============================================================

- powershell: |
    Write-Host "=============================================="
    Write-Host "VERIFYING BASIC TOOLS"
    Write-Host "=============================================="

    git --version
    terraform version
    az version

  displayName: 'Verify Git Terraform Azure CLI'


# ============================================================
# 4. GITLEAKS VERIFY
# ============================================================

- powershell: |
    $gitLeaksPath = "C:\Users\Niklesh k\AppData\Local\Microsoft\WinGet\Packages\Gitleaks.Gitleaks_Microsoft.Winget.Source_8wekyb3d8bbwe"

    Write-Host "=============================================="
    Write-Host "VERIFY GITLEAKS"
    Write-Host "=============================================="

    & "$gitLeaksPath\gitleaks.exe" version

    if ($LASTEXITCODE -ne 0) {
      Write-Error "GitLeaks is not working."
      exit 1
    }

  displayName: 'Verify GitLeaks'


# ============================================================
# 5. GITLEAKS SCAN
# ============================================================

- powershell: |
    $gitLeaksPath = "C:\Users\Niklesh k\AppData\Local\Microsoft\WinGet\Packages\Gitleaks.Gitleaks_Microsoft.Winget.Source_8wekyb3d8bbwe"

    Write-Host "=============================================="
    Write-Host "[1/9] GITLEAKS - SECRET SCAN"
    Write-Host "=============================================="

    New-Item `
      -ItemType Directory `
      -Force `
      -Path "$(Build.ArtifactStagingDirectory)" | Out-Null

    & "$gitLeaksPath\gitleaks.exe" detect `
      --source "$(Build.SourcesDirectory)" `
      --report-format sarif `
      --report-path "$(Build.ArtifactStagingDirectory)\gitleaks.sarif" `
      --no-banner

    if ($LASTEXITCODE -ne 0) {
      Write-Error "GitLeaks detected secrets."
      exit 1
    }

    Write-Host "GitLeaks scan PASSED."

  displayName: 'GitLeaks - Secret Scan'


# ============================================================
# 6. CHECKOV - RESOURCE GROUP
# ============================================================

- powershell: |
    $checkov = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312\Scripts\checkov.exe"

    Write-Host "============================================================"
    Write-Host "[2/9] CHECKOV - RESOURCE GROUP"
    Write-Host "============================================================"

    $path = "$(Build.SourcesDirectory)\23-08-26\module\rg"

    Write-Host "Scanning:"
    Write-Host $path

    & $checkov `
      -d $path `
      --framework terraform `
      --output cli

    $exitCode = $LASTEXITCODE

    Write-Host "Resource Group Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Error "Resource Group Checkov scan FAILED."
      exit 1
    }

    Write-Host "RESOURCE GROUP SCAN PASSED."

  displayName: 'Checkov - Resource Group'


# ============================================================
# 7. CHECKOV - VNET
# ============================================================

- powershell: |
    $checkov = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312\Scripts\checkov.exe"

    Write-Host "============================================================"
    Write-Host "[3/9] CHECKOV - VNET"
    Write-Host "============================================================"

    $path = "$(Build.SourcesDirectory)\23-08-26\module\vnet"

    Write-Host "Scanning:"
    Write-Host $path

    & $checkov `
      -d $path `
      --framework terraform `
      --output cli

    $exitCode = $LASTEXITCODE

    Write-Host "VNET Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Error "VNET Checkov scan FAILED."
      exit 1
    }

    Write-Host "VNET SCAN PASSED."

  displayName: 'Checkov - VNET'


# ============================================================
# 8. CHECKOV - SUBNET
# ============================================================

- powershell: |
    $checkov = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312\Scripts\checkov.exe"

    Write-Host "============================================================"
    Write-Host "[4/9] CHECKOV - SUBNET"
    Write-Host "============================================================"

    $path = "$(Build.SourcesDirectory)\23-08-26\module\subnet"

    Write-Host "Scanning:"
    Write-Host $path

    & $checkov `
      -d $path `
      --framework terraform `
      --output cli

    $exitCode = $LASTEXITCODE

    Write-Host "Subnet Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Error "Subnet Checkov scan FAILED."
      exit 1
    }

    Write-Host "SUBNET SCAN PASSED."

  displayName: 'Checkov - Subnet'


# ============================================================
# 9. CHECKOV - PUBLIC IP
# ============================================================

- powershell: |
    $checkov = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312\Scripts\checkov.exe"

    Write-Host "============================================================"
    Write-Host "[5/9] CHECKOV - PUBLIC IP"
    Write-Host "============================================================"

    $path = "$(Build.SourcesDirectory)\23-08-26\module\pip"

    if (-not (Test-Path $path)) {
      Write-Error "Public IP module does not exist: $path"
      exit 1
    }

    Write-Host "Scanning:"
    Write-Host $path

    & $checkov `
      -d $path `
      --framework terraform `
      --output cli

    $exitCode = $LASTEXITCODE

    Write-Host "Public IP Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Error "Public IP Checkov scan FAILED."
      exit 1
    }

    Write-Host "PUBLIC IP SCAN PASSED."

  displayName: 'Checkov - Public IP'


# ============================================================
# 10. CHECKOV - NIC
# ============================================================

- powershell: |
    $checkov = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312\Scripts\checkov.exe"

    Write-Host "============================================================"
    Write-Host "[6/9] CHECKOV - NIC"
    Write-Host "============================================================"

    $path = "$(Build.SourcesDirectory)\23-08-26\module\nic"

    Write-Host "Scanning:"
    Write-Host $path

    & $checkov `
      -d $path `
      --framework terraform `
      --output cli

    $exitCode = $LASTEXITCODE

    Write-Host "NIC Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Error "NIC Checkov scan FAILED."
      exit 1
    }

    Write-Host "NIC SCAN PASSED."

  displayName: 'Checkov - NIC'


# ============================================================
# 11. CHECKOV - NSG
# ============================================================

- powershell: |
    $checkov = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312\Scripts\checkov.exe"

    Write-Host "============================================================"
    Write-Host "[7/9] CHECKOV - NSG"
    Write-Host "============================================================"

    $path = "$(Build.SourcesDirectory)\23-08-26\module\nsg"

    Write-Host "Scanning:"
    Write-Host $path

    & $checkov `
      -d $path `
      --framework terraform `
      --output cli

    $exitCode = $LASTEXITCODE

    Write-Host "NSG Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Error "NSG Checkov scan FAILED."
      exit 1
    }

    Write-Host "NSG SCAN PASSED."

  displayName: 'Checkov - NSG'


# ============================================================
# 12. CHECKOV - VM
# ============================================================

- powershell: |
    $checkov = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312\Scripts\checkov.exe"

    Write-Host "============================================================"
    Write-Host "[8/9] CHECKOV - VM"
    Write-Host "============================================================"

    $path = "$(Build.SourcesDirectory)\23-08-26\module\vm"

    Write-Host "Scanning:"
    Write-Host $path

    & $checkov `
      -d $path `
      --framework terraform `
      --output cli

    $exitCode = $LASTEXITCODE

    Write-Host "VM Checkov Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Error "VM Checkov scan FAILED."
      exit 1
    }

    Write-Host "VM SCAN PASSED."

  displayName: 'Checkov - VM'


# ============================================================
# 13. SNYK IaC
# ============================================================

- powershell: |
    $snyk = "C:\Users\Niklesh k\AppData\Roaming\npm\snyk.cmd"

    Write-Host "============================================================"
    Write-Host "[9/9] SNYK - IaC SECURITY SCAN"
    Write-Host "============================================================"

    Write-Host "Snyk version:"
    & $snyk --version

    if (-not $env:SNYK_TOKEN) {
      Write-Error "SNYK_TOKEN is not configured."
      exit 1
    }

    Write-Host "Authenticating Snyk..."

    & $snyk auth $env:SNYK_TOKEN

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Snyk authentication failed."
      exit 1
    }

    Write-Host "Running Snyk IaC scan..."

    & $snyk iac test "$(Build.SourcesDirectory)\23-08-26"

    $exitCode = $LASTEXITCODE

    Write-Host "Snyk Exit Code: $exitCode"

    if ($exitCode -ne 0) {
      Write-Error "Snyk IaC scan found security issues."
      exit 1
    }

    Write-Host "Snyk IaC scan PASSED."

  displayName: 'Snyk - IaC Security Scan'
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)


# ============================================================
# 14. TERRAFORM FORMAT
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "============================================================"
    Write-Host "TERRAFORM FORMAT CHECK"
    Write-Host "============================================================"

    terraform fmt -check -recursive

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform format check FAILED."
      exit 1
    }

    Write-Host "Terraform format check PASSED."

  displayName: 'Terraform - Format Check'


# ============================================================
# 15. TERRAFORM INIT
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "============================================================"
    Write-Host "TERRAFORM INIT"
    Write-Host "============================================================"

    terraform init -input=false

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform init FAILED."
      exit 1
    }

    Write-Host "Terraform init PASSED."

  displayName: 'Terraform - Init'


# ============================================================
# 16. TERRAFORM VALIDATE
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "============================================================"
    Write-Host "TERRAFORM VALIDATE"
    Write-Host "============================================================"

    terraform validate

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform validation FAILED."
      exit 1
    }

    Write-Host "Terraform validation PASSED."

  displayName: 'Terraform - Validate'


# ============================================================
# 17. PUBLISH SECURITY REPORTS
# ============================================================

- task: PublishBuildArtifacts@1
  displayName: 'Publish Security Scan Reports'
  condition: always()
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'SecurityScanReports'
    publishLocation: 'Container'


# ============================================================
# 18. CI COMPLETE
# ============================================================

- powershell: |
    Write-Host "============================================================"
    Write-Host "              DEV CI PIPELINE COMPLETED"
    Write-Host "============================================================"

    Write-Host "Branch      : $(Build.SourceBranch)"
    Write-Host "Build       : $(Build.BuildNumber)"
    Write-Host "Environment : DEV"

  displayName: 'CI Pipeline Completed'