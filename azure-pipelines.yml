    Write-Host "VM SCAN PASSED."

  displayName: 'Checkov - VM'


# ============================================================
# 12. CHECKOV - FULL TERRAFORM SCAN
# ============================================================

- powershell: |
    $pythonPath = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonPath\Scripts"

    $env:PATH = "$pythonScripts;$pythonPath;$env:PATH"

    Write-Host ""
    Write-Host "============================================================"
    Write-Host "FULL TERRAFORM CHECKOV SCAN"
    Write-Host "============================================================"

    $scanPath = "$(Build.SourcesDirectory)\23-08-26"

    Write-Host "Full scan path:"
    Write-Host $scanPath

    New-Item `
      -ItemType Directory `
      -Force `
      -Path "$(Build.ArtifactStagingDirectory)" | Out-Null

    checkov `
      -d "$scanPath" `
      --framework terraform `
      --skip-check CKV_AZURE_50 `
      --output cli

    $checkovExitCode = $LASTEXITCODE

    Write-Host ""
    Write-Host "============================================================"
    Write-Host "CHECKOV EXIT CODE: $checkovExitCode"
    Write-Host "============================================================"

    # Create SARIF report
    checkov `
      -d "$scanPath" `
      --framework terraform `
      --skip-check CKV_AZURE_50 `
      --output sarif `
      --output-file-path "$(Build.ArtifactStagingDirectory)\checkov.sarif"

    if ($checkovExitCode -ne 0) {
      Write-Error "Full Checkov security scan failed."
      exit 1
    }

    Write-Host "FULL CHECKOV SCAN PASSED."

  displayName: 'Checkov - Full Terraform Scan'


# ============================================================
# 13. SNYK IaC SCAN
# ============================================================

- powershell: |
    $nodePath = "C:\Program Files\nodejs"
    $snykPath = "C:\Users\Niklesh k\AppData\Roaming\npm"

    $env:PATH = "$nodePath;$snykPath;$env:PATH"

    Write-Host ""
    Write-Host "============================================================"
    Write-Host "SNYK IaC SECURITY SCAN"
    Write-Host "============================================================"

    Write-Host ""
    Write-Host "Snyk version:"
    snyk.cmd --version

    if (-not $env:SNYK_TOKEN) {
      Write-Error "SNYK_TOKEN is not configured in Azure DevOps."
      exit 1
    }

    Write-Host ""
    Write-Host "Authenticating Snyk..."

    snyk.cmd auth $env:SNYK_TOKEN

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Snyk authentication failed."
      exit 1
    }

    Write-Host ""
    Write-Host "Scanning Terraform:"
    Write-Host "$(Build.SourcesDirectory)\23-08-26"

    snyk.cmd iac test "$(Build.SourcesDirectory)\23-08-26"

    $snykExitCode = $LASTEXITCODE

    Write-Host ""
    Write-Host "Snyk Exit Code: $snykExitCode"

    if ($snykExitCode -ne 0) {
      Write-Error "Snyk IaC scan found security issues."
      exit 1
    }

    Write-Host "Snyk IaC scan PASSED."

  displayName: 'Snyk - IaC Security Scan'

  env:
    SNYK_TOKEN: $(SNYK_TOKEN)


# ============================================================
# 14. TERRAFORM FORMAT
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host ""
    Write-Host "============================================================"
    Write-Host "TERRAFORM FORMAT CHECK"
    Write-Host "============================================================"

    terraform fmt -check -recursive

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform format check failed."
      exit 1
    }

    Write-Host "Terraform format check PASSED."

  displayName: 'Terraform - Format Check'


# ============================================================
# 15. TERRAFORM INIT
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host ""
    Write-Host "============================================================"
    Write-Host "TERRAFORM INIT - DEV"
    Write-Host "============================================================"

    terraform init -input=false

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform init failed."
      exit 1
    }

    Write-Host "Terraform init PASSED."

  displayName: 'Terraform - Init'


# ============================================================
# 16. TERRAFORM VALIDATE
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host ""
    Write-Host "============================================================"
    Write-Host "TERRAFORM VALIDATE - DEV"
    Write-Host "============================================================"

    terraform validate

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform validation failed."
      exit 1
    }

    Write-Host "Terraform validate PASSED."

  displayName: 'Terraform - Validate'


# ============================================================
# 17. PUBLISH SECURITY REPORTS
# ============================================================

- task: PublishBuildArtifacts@1
  displayName: 'Publish Security Scan Reports'
  condition: always()
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'SecurityScanReports'
    publishLocation: 'Container'


# ============================================================
# 18. CI COMPLETE
# ============================================================

- powershell: |
    Write-Host ""
    Write-Host "============================================================"
    Write-Host "       DEV CI PIPELINE COMPLETED"
    Write-Host "============================================================"

    Write-Host ""
    Write-Host "Branch              : $(Build.SourceBranch)"
    Write-Host "Build               : $(Build.BuildNumber)"
    Write-Host "Environment         : DEV"

    Write-Host ""
    Write-Host "GitLeaks             : PASSED"
    Write-Host "Checkov RG           : PASSED"
    Write-Host "Checkov VNET         : PASSED"
    Write-Host "Checkov Public IP    : PASSED"
    Write-Host "Checkov Subnet       : PASSED"
    Write-Host "Checkov NIC          : PASSED"
    Write-Host "Checkov NSG          : PASSED"
    Write-Host "Checkov VM           : PASSED"
    Write-Host "Checkov Full Scan    : PASSED"
    Write-Host "Snyk IaC             : PASSED"
    Write-Host "Terraform fmt        : PASSED"
    Write-Host "Terraform init       : PASSED"
    Write-Host "Terraform validate   : PASSED"

    Write-Host ""
    Write-Host "============================================================"
    Write-Host "DEV CI PIPELINE COMPLETED SUCCESSFULLY"
    Write-Host "============================================================"

  displayName: 'CI Pipeline Completed'
