trigger:
- fetaure

pool:
  name: Terraform-Agent-Pool

variables:
  TF_IN_AUTOMATION: 'true'
  TF_WORKING_DIR: '23-08-26/env/dev'

steps:

# ============================================================
# 1. CHECKOUT SOURCE CODE
# ============================================================

- checkout: self
  clean: true
  displayName: 'Checkout source code'


# ============================================================
# 2. CONFIGURE AND VERIFY ALL TOOLS
# ============================================================

- powershell: |
    Write-Host "=============================================="
    Write-Host "CONFIGURING DEVSECOPS TOOL PATHS"
    Write-Host "=============================================="

    $pythonPath = "$env:USERPROFILE\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonPath\Scripts"

    $nodePath = "C:\Program Files\nodejs"
    $npmPath = "$env:USERPROFILE\AppData\Roaming\npm"

    $gitleaksPath = "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\Gitleaks.Gitleaks_Microsoft.Winget.Source_8wekyb3d8bbwe"

    $env:Path = "$gitleaksPath;$pythonPath;$pythonScripts;$nodePath;$npmPath;$env:Path"

    Write-Host ""
    Write-Host "Git:"
    git --version

    Write-Host ""
    Write-Host "Terraform:"
    terraform version

    Write-Host ""
    Write-Host "Azure CLI:"
    az version

    Write-Host ""
    Write-Host "GitLeaks:"
    & "$gitleaksPath\gitleaks.exe" version

    Write-Host ""
    Write-Host "Python:"
    python --version

    Write-Host ""
    Write-Host "Checkov:"
    & "$pythonScripts\checkov.cmd" --version

    Write-Host ""
    Write-Host "Node.js:"
    node --version

    Write-Host ""
    Write-Host "npm:"
    npm.cmd --version

    Write-Host ""
    Write-Host "Snyk:"
    & "$npmPath\snyk.cmd" --version

  displayName: 'Verify All DevSecOps Tools'


# ============================================================
# 3. GITLEAKS SECRET SCAN
# ============================================================

- powershell: |
    Write-Host "=============================================="
    Write-Host "GITLEAKS SECRET SCAN"
    Write-Host "=============================================="

    $gitleaksPath = "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\Gitleaks.Gitleaks_Microsoft.Winget.Source_8wekyb3d8bbwe\gitleaks.exe"

    if (-not (Test-Path $gitleaksPath)) {
      Write-Error "GitLeaks not found."
      exit 1
    }

    New-Item `
      -ItemType Directory `
      -Force `
      -Path "$(Build.ArtifactStagingDirectory)" | Out-Null

    & $gitleaksPath detect `
      --source "$(Build.SourcesDirectory)" `
      --report-format sarif `
      --report-path "$(Build.ArtifactStagingDirectory)\gitleaks.sarif" `
      --no-banner

    if ($LASTEXITCODE -ne 0) {
      Write-Error "GitLeaks detected secrets."
      exit 1
    }

    Write-Host "GitLeaks scan PASSED."

  displayName: 'GitLeaks - Secret Scan'


# ============================================================
# 4. CHECKOV IaC SECURITY SCAN
# ============================================================

- powershell: |
    Write-Host "=============================================="
    Write-Host "CHECKOV IaC SECURITY SCAN"
    Write-Host "=============================================="

    $pythonPath = "$env:USERPROFILE\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonPath\Scripts"

    $env:Path = "$pythonPath;$pythonScripts;$env:Path"

    $checkov = "$pythonScripts\checkov.cmd"

    if (-not (Test-Path $checkov)) {
      Write-Error "Checkov not found."
      exit 1
    }

    New-Item `
      -ItemType Directory `
      -Force `
      -Path "$(Build.ArtifactStagingDirectory)" | Out-Null

    Write-Host ""
    Write-Host "Running Checkov..."
    Write-Host ""

    & $checkov `
      -d "$(Build.SourcesDirectory)\23-08-26" `
      --framework terraform `
      --output cli

    Write-Host ""
    Write-Host "=============================================="
    Write-Host "CHECKOV EXIT CODE: $LASTEXITCODE"
    Write-Host "=============================================="

    Write-Host ""
    Write-Host "IMPORTANT:"
    Write-Host "Checkov findings are being displayed for analysis."
    Write-Host "Pipeline will NOT fail at this stage."
    Write-Host ""

    # TEMPORARY
    # We are keeping the pipeline running so that
    # we can identify the exact Checkov policy failures.
    exit 0

  displayName: 'Checkov - IaC Security Scan'


# ============================================================
# 5. SNYK IaC SECURITY SCAN
# ============================================================

- powershell: |
    Write-Host "=============================================="
    Write-Host "SNYK IaC SECURITY SCAN"
    Write-Host "=============================================="

    $nodePath = "C:\Program Files\nodejs"
    $npmPath = "$env:USERPROFILE\AppData\Roaming\npm"

    $env:Path = "$nodePath;$npmPath;$env:Path"

    $snyk = "$npmPath\snyk.cmd"

    if (-not (Test-Path $snyk)) {
      Write-Error "Snyk not found."
      exit 1
    }

    if (-not $env:SNYK_TOKEN) {
      Write-Error "SNYK_TOKEN is not configured."
      exit 1
    }

    Write-Host ""
    Write-Host "Snyk version:"
    & $snyk --version

    Write-Host ""
    Write-Host "Authenticating Snyk..."

    & $snyk auth $env:SNYK_TOKEN

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Snyk authentication failed."
      exit 1
    }

    Write-Host ""
    Write-Host "Running Snyk IaC scan..."

    & $snyk iac test `
      "$(Build.SourcesDirectory)\23-08-26"

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Snyk IaC scan failed."
      exit 1
    }

    Write-Host ""
    Write-Host "Snyk IaC scan PASSED."

  displayName: 'Snyk - IaC Security Scan'
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)


# ============================================================
# 6. TERRAFORM FORMAT
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "=============================================="
    Write-Host "TERRAFORM FORMAT CHECK"
    Write-Host "=============================================="

    terraform fmt -check -recursive

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform format check failed."
      exit 1
    }

    Write-Host "Terraform format check PASSED."

  displayName: 'Terraform - Format Check'


# ============================================================
# 7. TERRAFORM INIT
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "=============================================="
    Write-Host "TERRAFORM INIT"
    Write-Host "=============================================="

    terraform init -input=false

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform init failed."
      exit 1
    }

    Write-Host "Terraform init PASSED."

  displayName: 'Terraform - Init'


# ============================================================
# 8. TERRAFORM VALIDATE
# ============================================================

- powershell: |
    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    Write-Host "=============================================="
    Write-Host "TERRAFORM VALIDATE"
    Write-Host "=============================================="

    terraform validate

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform validation failed."
      exit 1
    }

    Write-Host "Terraform validate PASSED."

  displayName: 'Terraform - Validate'


# ============================================================
# 9. PUBLISH SECURITY REPORTS
# ============================================================

- task: PublishBuildArtifacts@1
  displayName: 'Publish Security Scan Reports'
  condition: always()
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'SecurityScanReports'
    publishLocation: 'Container'


# ============================================================
# 10. CI COMPLETE
# ============================================================

- powershell: |
    Write-Host "=============================================="
    Write-Host "       DEV CI PIPELINE COMPLETED"
    Write-Host "=============================================="

    Write-Host "Branch      : $(Build.SourceBranch)"
    Write-Host "Build       : $(Build.BuildNumber)"
    Write-Host "Environment : DEV"

  displayName: 'CI Pipeline Completed'