
trigger:
  branches:
    include:
      - fetaure

pool:
  name: Terraform-Agent-Pool

variables:
  TF_IN_AUTOMATION: 'true'
  TF_WORKING_DIR: '23-08-26/env/dev'

steps:

# ============================================================
# 1. CHECKOUT SOURCE CODE
# ============================================================

- checkout: self
  clean: true
  displayName: 'Checkout source code'


# ============================================================
# 2. CONFIGURE DEVSECOPS TOOL PATHS
# ============================================================

- powershell: |
    Write-Host "=============================================="
    Write-Host "CONFIGURING DEVSECOPS TOOL PATHS"
    Write-Host "=============================================="

    # Python + Checkov
    $pythonPath = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonPath\Scripts"

    # GitLeaks
    $gitleaksPath = "C:\Users\Niklesh k\AppData\Local\Microsoft\WinGet\Packages\Gitleaks.Gitleaks_Microsoft.Winget.Source_8wekyb3d8bbwe"

    # Node.js
    $nodePath = "C:\Program Files\nodejs"

    # Snyk
    $snykPath = "C:\Users\Niklesh k\AppData\Roaming\npm"

    $env:Path = "$pythonPath;$pythonScripts;$gitleaksPath;$nodePath;$snykPath;$env:Path"

    Write-Host "PATH configured."

    Write-Host "`nGit:"
    git --version

    Write-Host "`nTerraform:"
    terraform version

    Write-Host "`nAzure CLI:"
    az version

    Write-Host "`nPython:"
    python --version

    Write-Host "`nCheckov:"
    checkov --version

    Write-Host "`nGitLeaks:"
    gitleaks version

    Write-Host "`nNode:"
    node --version

    Write-Host "`nNPM:"
    npm.cmd --version

    Write-Host "`nSnyk:"
    snyk.cmd --version

  displayName: 'Verify All DevSecOps Tools'


# ============================================================
# 3. GITLEAKS SECRET SCAN
# ============================================================

- powershell: |
    Write-Host "=============================================="
    Write-Host "GITLEAKS SECRET SCAN"
    Write-Host "=============================================="

    $gitleaksPath = "C:\Users\Niklesh k\AppData\Local\Microsoft\WinGet\Packages\Gitleaks.Gitleaks_Microsoft.Winget.Source_8wekyb3d8bbwe"
    $env:Path = "$gitleaksPath;$env:Path"

    New-Item `
      -ItemType Directory `
      -Force `
      -Path "$(Build.ArtifactStagingDirectory)" | Out-Null

    gitleaks detect `
      --source "$(Build.SourcesDirectory)" `
      --report-format sarif `
      --report-path "$(Build.ArtifactStagingDirectory)\gitleaks.sarif" `
      --no-banner

    if ($LASTEXITCODE -ne 0) {
      Write-Error "GitLeaks detected secrets."
      exit 1
    }

    Write-Host "GitLeaks scan passed."

  displayName: 'GitLeaks - Secret Scan'


# ============================================================
# 4. CHECKOV IaC SECURITY SCAN
# ============================================================

- powershell: |
    Write-Host "=============================================="
    Write-Host "CHECKOV IaC SECURITY SCAN"
    Write-Host "=============================================="

    $pythonPath = "C:\Users\Niklesh k\AppData\Local\Programs\Python\Python312"
    $pythonScripts = "$pythonPath\Scripts"

    $env:Path = "$pythonPath;$pythonScripts;$env:Path"

    python --version
    checkov --version

    New-Item `
      -ItemType Directory `
      -Force `
      -Path "$(Build.ArtifactStagingDirectory)" | Out-Null

    checkov `
      -d "$(Build.SourcesDirectory)\23-08-26" `
      --framework terraform `
      --output cli `
      --output sarif `
      --output-file-path "$(Build.ArtifactStagingDirectory)\checkov.sarif"

    $checkovExitCode = $LASTEXITCODE

    Write-Host "=============================================="
    Write-Host "CHECKOV EXIT CODE: $checkovExitCode"
    Write-Host "=============================================="

    if ($checkovExitCode -ne 0) {
      Write-Warning "Checkov found security issues."
      Write-Warning "Review the Checkov findings above."
      Write-Warning "Pipeline will stop because Checkov is configured as a security gate."
      exit 1
    }

    Write-Host "Checkov scan passed."

  displayName: 'Checkov - IaC Security Scan'


# ============================================================
# 5. SNYK IaC SECURITY SCAN
# ============================================================

- powershell: |
    Write-Host "=============================================="
    Write-Host "SNYK IaC SECURITY SCAN"
    Write-Host "=============================================="

    $snykPath = "C:\Users\Niklesh k\AppData\Roaming\npm"
    $env:Path = "$snykPath;$env:Path"

    snyk.cmd --version

    if (-not $env:SNYK_TOKEN) {
      Write-Error "SNYK_TOKEN is not configured in Azure DevOps."
      exit 1
    }

    snyk.cmd auth $env:SNYK_TOKEN

    Write-Host "Running Snyk IaC scan..."

    snyk.cmd iac test "$(Build.SourcesDirectory)\23-08-26"

    $snykExitCode = $LASTEXITCODE

    Write-Host "=============================================="
    Write-Host "SNYK EXIT CODE: $snykExitCode"
    Write-Host "=============================================="

    if ($snykExitCode -ne 0) {
      Write-Warning "Snyk found IaC security issues."
      Write-Warning "Review the Snyk findings above."
      Write-Warning "Pipeline will continue because this is a testing pipeline."
      exit 0
    }

    Write-Host "Snyk IaC scan passed."

  displayName: 'Snyk - IaC Security Scan'
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)


# ============================================================
# 6. TERRAFORM FORMAT CHECK
# ============================================================

- powershell: |
    Write-Host "=============================================="
    Write-Host "TERRAFORM FORMAT CHECK"
    Write-Host "=============================================="

    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    terraform fmt -check -recursive

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform format check failed."
      exit 1
    }

    Write-Host "Terraform format check passed."

  displayName: 'Terraform - Format Check'


# ============================================================
# 7. TERRAFORM INIT
# ============================================================

- powershell: |
    Write-Host "=============================================="
    Write-Host "TERRAFORM INIT"
    Write-Host "=============================================="

    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    terraform init -input=false

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform init failed."
      exit 1
    }

    Write-Host "Terraform init completed."

  displayName: 'Terraform - Init'


# ============================================================
# 8. TERRAFORM VALIDATE
# ============================================================

- powershell: |
    Write-Host "=============================================="
    Write-Host "TERRAFORM VALIDATE"
    Write-Host "=============================================="

    Set-Location "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

    terraform validate

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Terraform validation failed."
      exit 1
    }

    Write-Host "Terraform validation passed."

  displayName: 'Terraform - Validate'


# ============================================================
# 9. PUBLISH SECURITY REPORTS
# ============================================================

- task: PublishBuildArtifacts@1
  displayName: 'Publish Security Scan Reports'
  condition: always()
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'SecurityScanReports'
    publishLocation: 'Container'


# ============================================================
# 10. CI COMPLETE
# ============================================================

- powershell: |
    Write-Host ""
    Write-Host "=============================================="
    Write-Host "       DEV CI PIPELINE COMPLETED"
    Write-Host "=============================================="
    Write-Host ""
    Write-Host "Branch       : $(Build.SourceBranch)"
    Write-Host "Build        : $(Build.BuildNumber)"
    Write-Host "Environment  : DEV"
    Write-Host ""
    Write-Host "Scans:"
    Write-Host "  GitLeaks   : Completed"
    Write-Host "  Checkov    : Completed"
    Write-Host "  Snyk       : Completed"
    Write-Host ""
    Write-Host "Terraform:"
    Write-Host "  Format     : Completed"
    Write-Host "  Init       : Completed"
    Write-Host "  Validate   : Completed"
    Write-Host ""
    Write-Host "Terraform APPLY is NOT performed in this CI pipeline."
    Write-Host "=============================================="

  displayName: 'CI Pipeline Completed'

